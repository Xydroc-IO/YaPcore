# YaP Shaders — Iris / OptiFine format
# Options are discovered from shaders/lib/options.glsl (#define ... // [values])

# Default HIGH — horizon haze off (it muddied dawn with vanilla fogColor)
profile.LOW=WAVE_STRENGTH:0.85 WIND WIND_STRENGTH:0.75 SSR SSR_STEPS:24 REFRACTION CAUSTICS SPECULAR SUN_GLOW !HORIZON_HAZE VOLUMETRIC_CLOUDS CLOUD_STEPS:8
profile.MEDIUM=WAVE_STRENGTH:1.20 WIND WIND_STRENGTH:1.00 SSR SSR_STEPS:40 REFRACTION CAUSTICS SPECULAR SUN_GLOW !HORIZON_HAZE VOLUMETRIC_CLOUDS CLOUD_STEPS:12
profile.HIGH=WAVE_STRENGTH:1.50 WIND WIND_STRENGTH:1.15 SSR SSR_STEPS:56 REFRACTION CAUSTICS SPECULAR SUN_GLOW !HORIZON_HAZE VOLUMETRIC_CLOUDS CLOUD_STEPS:16

profile=HIGH

screen=<profile> [<wave>] [<wind>] [<waterfx>] [<sky>] [<clouds>]
screen.wave=WAVE_STRENGTH
screen.wind=WIND WIND_STRENGTH
screen.waterfx=SSR SSR_STEPS REFRACTION CAUSTICS SPECULAR
screen.sky=SUN_GLOW HORIZON_HAZE
screen.clouds=VOLUMETRIC_CLOUDS CLOUD_STEPS

# Hide vanilla flat cloud plane when volumetric clouds are used
clouds=off
# Keep vanilla star points (drawn in gbuffers_skybasic / renderStage STARS)
stars=true
sky=true
# Distant cutout leaves: Iris default HALF_ALPHA (0.5) fights bilinear edges —
# we discard in-shader with a distance-aware threshold; keep pack override loose.
alphaTest.gbuffers_terrain_cutout=GREATER 0.1
oldLighting=false
underwaterOverlay=false
sunPathRotation=-40.0
ambientOcclusionLevel=1.0
shadowMapResolution=1024
shadowDistance=160.0
shadowIntervalSize=2.0
shadowHardwareFiltering=true

colortex0Format=RGBA16F
colortex1Format=RGBA16F
colortex2Format=RGBA8
colortex3Format=RGBA16F
