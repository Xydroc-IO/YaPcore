# YaP Shaders — Iris block entity IDs for wind / water
# mc_Entity only on gbuffers_terrain* / gbuffers_water / shadow.
#
# Wind (leaves / plants only — logs & wood intentionally unmapped so builds don't sway):
#   10011 birch+cherry+pale leaves   — flexible
#   10012 oak+acacia+mangrove leaves — medium
#   10013 spruce+dark_oak leaves     — stiff
#   10014 jungle leaves              — tall / heavy canopy
#   10015 azalea leaves              — soft shrub
#   10025 azalea bush plant
#   10002 grass · 10003 vines
#   10001 water — Iris draws glass/ice through gbuffers_water too; only this ID gets waves

# Real water only (flowing uses the same block)
block.10001 = minecraft:water

# --- Flexible canopy (leaves only) ---
block.10011 = minecraft:birch_leaves minecraft:cherry_leaves minecraft:pale_oak_leaves birch_leaves cherry_leaves pale_oak_leaves

# --- Medium ---
block.10012 = minecraft:oak_leaves minecraft:acacia_leaves minecraft:mangrove_leaves oak_leaves acacia_leaves mangrove_leaves

# --- Stiff ---
block.10013 = minecraft:spruce_leaves minecraft:dark_oak_leaves spruce_leaves dark_oak_leaves

# --- Tall / heavy ---
block.10014 = minecraft:jungle_leaves jungle_leaves

# --- Soft shrub ---
block.10015 = minecraft:azalea_leaves minecraft:flowering_azalea_leaves azalea_leaves flowering_azalea_leaves
block.10025 = minecraft:azalea minecraft:flowering_azalea

