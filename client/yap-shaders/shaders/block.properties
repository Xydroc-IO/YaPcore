block.10003 = minecraft:vine minecraft:twisting_vines minecraft:twisting_vines_plant minecraft:weeping_vines minecraft:weeping_vines_plant minecraft:cave_vines minecraft:cave_vines_plant minecraft:glow_lichen vine

