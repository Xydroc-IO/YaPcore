# YaP Gameplay Knobs — Purpur-inspired encyclopedia (original MIT code).
# Not affiliated with PurpurMC.
# Supported: WASD ridables (ridable+controllable), MobGoal AI, block patches.
# Edit this file (or plugins/YaPGameplayKnobs/knobs.yml after first run).
#
# Per-mob AI example:
#   ai:
#     aware: true
#     disable-ai: false
#     disable-random-stroll: false
#     disable-panic: false
#     remove-goals: [CREEPER_SWELL, RANDOM_STROLL]   # VanillaGoal names
#

settings:
  enabled: true
  # Advertise a custom brand in server list (Paper may override)
  server-mod-name: "YaPcore"
  disable-give-dropping: false
  projectiles-bypass-mob-griefing: false

blocks:
  anvil:
    cumulative-cost: true
  barrel:
    rows: 3
  beehive:
    max-bees-inside: 3
  bed:
    explode: true
  crying-obsidian:
    valid-for-portal-frame: false
  lightning-rod:
    range: 128

gameplay:
  entity-blindness-multiplier: 1.0
  tick-fluids: true
  use-void-damage-fix: false
  player:
    netherite-fire-resistance: false
    totem-of-undying-works-in-void: false

mobs:
  allay:
    enabled: true
    ridable: false
    controllable: true
    ridable-in-water: false
    takes-damage-from-water: false
    always-drop-exp: false
    can-pick-up-loot: default
    breeding-delay-ticks: 6000
    attributes:
      max_health: 20
      scale: 1.0
    ridable-max-y: 320.0
    ai:
      aware: true
      disable-ai: false
      disable-random-stroll: false
      disable-panic: false
      remove-goals: []

