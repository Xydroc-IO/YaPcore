# YaP Shaders — Iris / OptiFine format
# Natural water + volumetric clouds + atmosphere skies

profile.LOW=WAVE_STRENGTH:0.65 SSR:true SSR_STEPS:20 REFRACTION:true CAUSTICS:true SPECULAR:true SUN_GLOW:true HORIZON_HAZE:false VOLUMETRIC_CLOUDS:true CLOUD_STEPS:10
profile.MEDIUM=WAVE_STRENGTH:1.0 SSR:true SSR_STEPS:36 REFRACTION:true CAUSTICS:true SPECULAR:true SUN_GLOW:true HORIZON_HAZE:false VOLUMETRIC_CLOUDS:true CLOUD_STEPS:16
profile.HIGH=WAVE_STRENGTH:1.15 SSR:true SSR_STEPS:56 REFRACTION:true CAUSTICS:true SPECULAR:true SUN_GLOW:true HORIZON_HAZE:true VOLUMETRIC_CLOUDS:true CLOUD_STEPS:24

profile=HIGH

screen=<profile> [<wave>] [<waterfx>] [<sky>] [<clouds>]
screen.wave=WAVE_STRENGTH
screen.waterfx=SSR SSR_STEPS REFRACTION CAUSTICS SPECULAR
screen.sky=SUN_GLOW HORIZON_HAZE
screen.clouds=VOLUMETRIC_CLOUDS CLOUD_STEPS

option.WAVE_STRENGTH=1.0
option.WAVE_STRENGTH.step=0.05
option.WAVE_STRENGTH.range=0.2 1.8
option.SSR=true
option.SSR_STEPS=32
option.SSR_STEPS.step=4
option.SSR_STEPS.range=8 64
option.REFRACTION=true
option.CAUSTICS=true
option.SPECULAR=true
option.SUN_GLOW=true
option.HORIZON_HAZE=false
option.VOLUMETRIC_CLOUDS=true
option.CLOUD_STEPS=16
option.CLOUD_STEPS.step=2
option.CLOUD_STEPS.range=8 32

# Hide vanilla flat cloud plane when volumetric clouds are used
clouds=off
oldLighting=false
underwaterOverlay=false
sunPathRotation=-40.0
ambientOcclusionLevel=1.0
shadowMapResolution=1024
shadowDistance=160.0
shadowIntervalSize=2.0
shadowHardwareFiltering=true

colortex0Format=RGBA16F
colortex1Format=RGBA16F
colortex2Format=RGBA8
colortex3Format=RGBA16F
