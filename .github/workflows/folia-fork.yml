# Folia fork checks — patch validation on PRs; full jar build on main/nightly/manual.
name: Folia fork

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # nightly UTC
  pull_request:
    paths:
      - "vendor/folia/**"
      - "scripts/vendor-folia.sh"
      - "scripts/folia-patch.sh"
      - "scripts/build-yap-folia.sh"
      - "scripts/verify-yap-folia.sh"
      - "src/main/java/com/yapcore/folia/**"
      - "src/main/java/com/yapcore/config/authority/FoliaAuthorityConfig.java"
      - "docs/folia/FOLIA_FORK.md"
  push:
    branches: [main]
    paths:
      - "vendor/folia/**"
      - "scripts/vendor-folia.sh"
      - "scripts/folia-patch.sh"
      - "scripts/build-yap-folia.sh"
      - "scripts/verify-yap-folia.sh"

jobs:
  patch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Vendor Folia pin + check YaP patches
        run: |
          ./scripts/vendor-folia.sh
          ./scripts/folia-patch.sh --check
      - name: Compile chassis FoliaFiles (no full Folia build)
        run: gradle compileJava --no-daemon -q

  build-yap-folia:
    needs: patch-check
    # Full Paperweight build — PR stays on patch-check only
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build YaP-Folia paperclip
        env:
          SKIP_SMOKE: "1"
        run: ./scripts/verify-yap-folia.sh
      - uses: actions/upload-artifact@v4
        with:
          name: yap-folia-${{ github.sha }}
          path: lib/yap-folia-*.jar
          retention-days: 7
          if-no-files-found: error
