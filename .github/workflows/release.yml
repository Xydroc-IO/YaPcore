name: Release

on:
  push:
    tags:
      - "v*"
      - "1.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch Folia
        run: bash scripts/fetch-folia.sh

      - name: Build release
        run: gradle assembleRelease --no-daemon

      - name: Package linux zip
        run: |
          cd build/dist
          zip -r yapcore-release-linux.zip yapcore-release/linux

      - name: Package windows zip
        run: |
          cd build/dist
          zip -r yapcore-release-windows.zip yapcore-release/windows

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/yapcore-release-linux.zip
            build/dist/yapcore-release-windows.zip
          generate_release_notes: true
