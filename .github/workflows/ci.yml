name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/bench/*.sh scripts/yapctl || true
      - name: Domain line limits (≤500)
        run: gradle checkDomainLineLimits --no-daemon
      - name: DB bootstrap hygiene
        run: gradle checkDbBootstrapHygiene --no-daemon
      - name: High-value plugin unit suites
        run: >
          gradle --no-daemon
          :yap-db-api:test
          :protect-plugin:test
          :factions-plugin:test
          :essentials-plugin:test
          :chat-plugin:test
          :world-plugin:test
          :yap-factions-api:test
      - name: Build shadow JAR
        run: gradle shadowJar --no-daemon
      - name: Concurrency + unit tests
        run: gradle verifyConcurrency --no-daemon
      - name: Short soak (retention)
        run: gradle soakTest --no-daemon
      - name: Folia-compat scan (first-party plugins)
        run: gradle scanFirstPartyFoliaCompat --no-daemon
      - name: MSPT compare script fixtures
        run: gradle checkMsptRegressionFixtures --no-daemon
