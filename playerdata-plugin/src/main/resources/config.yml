# Unique id for this backend (must differ on every Velocity backend)
server-id: lobby

# Inventory / XP / vitals profile key:
#   global  — shared across all backends (default)
#   server  — use server-id (per-server / minigame wipe)
#   <name>  — custom shared group (e.g. survival-network)
inventory-profile: global

# Shared MariaDB/MySQL — all backends must use the same database
jdbc:
  url: jdbc:mysql://127.0.0.1:3306/yap_playerdata?useSSL=false&allowPublicKeyRetrieval=true
  user: yap
  password: change-me

pool:
  maximum-pool-size: 8
  minimum-idle: 2
  connection-timeout-ms: 10000

autosave-seconds: 60
starting-balance: 0.00
lock-ttl-seconds: 120

sync:
  inventory: true
  enderchest: true
  xp: true
  vitals: true
  economy: true

homes:
  max: 3

mail:
  max-unread: 50

auctions:
  expire-hours: 48
  fee-percent: 0

claims:
  enabled: true
  require-claim-to-build: false
  tool: GOLDEN_SHOVEL
  inspect-tool: STICK
  starting-blocks: 2500
  blocks-per-hour: 100
  min-area: 9
  max-area: 50000
  visual-seconds: 8

kits:
  starter:
    delay-seconds: 86400
    items:
      - material: BREAD
        amount: 16
      - material: WOODEN_SWORD
        amount: 1

jobs:
  miner:
    display: Miner
    xp-per-action: 1.0
    break:
      COAL_ORE: 0.50
      DEEPSLATE_COAL_ORE: 0.50
      IRON_ORE: 1.00
      DEEPSLATE_IRON_ORE: 1.00
      DIAMOND_ORE: 5.00
      DEEPSLATE_DIAMOND_ORE: 5.00
  lumberjack:
    display: Lumberjack
    xp-per-action: 1.0
    break:
      OAK_LOG: 0.25
      BIRCH_LOG: 0.25
      SPRUCE_LOG: 0.25
      JUNGLE_LOG: 0.25
      ACACIA_LOG: 0.25
      DARK_OAK_LOG: 0.25
      CHERRY_LOG: 0.25
      MANGROVE_LOG: 0.25
