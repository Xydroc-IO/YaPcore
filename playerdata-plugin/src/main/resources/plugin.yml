name: YaPPlayerData
version: '1.0.0.0'
main: com.yapcore.playerdata.PlayerDataPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Cross-server data, offline /login, session lock, claims, NPC traders — YaPcore
website: https://github.com/yaplabs
softdepend: [Vault, PlaceholderAPI, YaPDB]
commands:
  register:
    description: Register an offline password
    usage: /register <password> <password>
    aliases: [reg]
  login:
    description: Log in with your offline password
    usage: /login <password>
    aliases: [l]
  changepassword:
    description: Change your password
    usage: /changepassword <old> <new>
    aliases: [changepass, cp]
  logout:
    description: Log out (must /login again)
    usage: /logout
  unregister:
    description: Admin — delete a password account
    usage: /unregister <player>
    permission: yapdata.admin
  menu:
    description: Open YaP hub GUI
    usage: /menu
    aliases: [yapmenu, playermenu]
    permission: yapdata.menu
  bal:
    description: Show your balance (or another player's)
    usage: /bal [player]
    aliases: [balance, money]
    permission: yapdata.balance
  pay:
    description: Pay another player
    usage: /pay <player> <amount>
    permission: yapdata.pay
  yapdata:
    description: Admin reload / status / force-save
    usage: /yapdata <reload|status|save>
    permission: yapdata.admin
  sethome:
    description: Set a home
    usage: /sethome [name]
    permission: yapdata.home
  home:
    description: Teleport to a home
    usage: /home [name]
    permission: yapdata.home
  delhome:
    description: Delete a home
    usage: /delhome <name>
    permission: yapdata.home
  homes:
    description: Homes GUI
    usage: /homes
    permission: yapdata.home
  setwarp:
    description: Set a server warp
    usage: /setwarp <name>
    permission: yapdata.warp.admin
  delwarp:
    description: Delete a warp
    usage: /delwarp <name>
    permission: yapdata.warp.admin
  warp:
    description: Teleport to a warp
    usage: /warp <name>
    permission: yapdata.warp
  warps:
    description: Warps GUI
    usage: /warps
    permission: yapdata.warp
  kit:
    description: Claim a kit
    usage: /kit [name]
    permission: yapdata.kit
  kits:
    description: Kits GUI
    usage: /kits
    permission: yapdata.kit
  mail:
    description: Mail GUI / send
    usage: /mail [read|clear|send <player> <msg>]
    permission: yapdata.mail
  shop:
    description: Chest shops
    usage: /shop <create <price>|remove|info>
    permission: yapdata.shop
  jobs:
    description: Jobs GUI / join / leave
    usage: /jobs [join|leave|list] [name]
    aliases: [job]
    permission: yapdata.jobs
  ah:
    description: Auction house GUI
    usage: /ah [list|sell <price>|buy <id>|cancel <id>]
    aliases: [auction, auctions]
    permission: yapdata.ah
  claim:
    description: Land claims — subdivide, tax, trust
    usage: /claim [tool|subdivide|tax|paytax|here|abandon|trust|untrust]
    aliases: [claims]
    permission: yapdata.claim
  trader:
    description: NPC traders admin
    usage: /trader <create|remove|addbuy|addsell|list|reload>
    permission: yapdata.trader.admin
    aliases: [npctrader, traders]
permissions:
  yapdata.admin:
    description: Reload, status, force-save, manage shops/auctions/claims/traders
    default: op
  yapdata.menu:
    description: Open /menu hub GUI
    default: true
  yapdata.balance:
    description: View your own balance
    default: true
  yapdata.balance.others:
    description: View other players' balances
    default: op
  yapdata.pay:
    description: Pay other players
    default: true
  yapdata.home:
    description: Set / use / delete homes
    default: true
  yapdata.warp:
    description: Use warps
    default: true
  yapdata.warp.admin:
    description: Create/delete warps
    default: op
  yapdata.kit:
    description: Open kits GUI / use /kit
    default: true
  yapdata.kit.starter:
    description: Claim the starter kit
    default: true
  yapdata.kit.*:
    description: Access all kits
    default: op
  yapdata.mail:
    description: Read / send / clear mail
    default: true
  yapdata.shop:
    description: Create shops and buy from chest shops
    default: true
  yapdata.jobs:
    description: Open jobs GUI / list jobs
    default: true
  yapdata.job.miner:
    description: Join the miner job
    default: true
  yapdata.job.lumberjack:
    description: Join the lumberjack job
    default: true
  yapdata.job.*:
    description: Join any job
    default: op
  yapdata.ah:
    description: Use the auction house
    default: true
  yapdata.claim:
    description: Use land claims
    default: true
  yapdata.claims.admin:
    description: Bypass claim protection
    default: op
  yapdata.claims.wilderness:
    description: Build in wilderness when require-claim-to-build is true
    default: false
  yapdata.trader.admin:
    description: Create and manage NPC traders
    default: op
