name: YaPDisasters
version: '1.0.0.0'
main: com.yapcore.disasters.DisastersPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: First-party Folia-safe natural disasters and extreme weather
website: https://github.com/yaplabs
softdepend: [YaPEssentials, YaPPerms, YaPRegions, YaPProtect, YaPPlayerData]
commands:
  yapdisaster:
    description: Natural disasters GUI / trigger
    usage: /yapdisaster [gui|type|stop|random|site|reload] …
    aliases: [disaster, disasters, nd, weather, weathergui, wweather]
    permission: yapdisasters.use
permissions:
  yapdisasters.use:
    description: Use /yapdisaster and weather extremes
    default: op
  yapdisasters.admin:
    description: Reload YaPDisasters config
    default: op
