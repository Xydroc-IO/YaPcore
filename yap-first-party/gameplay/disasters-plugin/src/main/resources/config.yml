# YaP Disasters — shipped defaults (typical SMP)
# Opt-in: leave enabled: false until you want extreme weather FX
# Go public: see docs/start/SECRETS.md + DEFAULTS.md LAN vs public table
# Prefer dashboard: Plugin settings or Disasters tab → Save → reload
# Grief stays off; when grief is on, claims + BUILD-deny regions stay safe.

enabled: false
broadcast-start: true
broadcast-end: true
default-duration-seconds: 120

# When false: lightning uses visual-only strikes; block grief skipped.
grief: false
real-lightning: false

# Even with grief:true, never modify claimed land / BUILD-deny regions.
protect-claims: true
protect-regions: true

# Worlds where disasters are allowed (empty = all).
allowed-worlds: []

# Phase 4 — random world events + warnings
warnings:
  enabled: true

random:
  # Off by default — enable in config, GUI, or dashboard
  enabled: false
  require-players: true
  min-interval-seconds: 900
  max-interval-seconds: 2400
  warning-seconds: 30
  duration-seconds: 120
  weights:
    thunder: 10
    hurricane: 6
    tornado: 5
    earthquake: 5
    volcano: 4
    blizzard: 6
    drought: 4
    meteor: 5
    tsunami: 3

# Soft volcano sites (tag real peaks; no worldgen). Add sites when enabled — see docs.
volcano-sites-ambient: true
volcano-site-snap-blocks: 48
volcano-sites: {}

disasters:
  clear:
    enabled: true
  rain:
    enabled: true
  thunder:
    enabled: true
    period-ticks: 35
  hurricane:
    enabled: true
    period-ticks: 12
  tornado:
    enabled: true
    period-ticks: 4
  earthquake:
    enabled: true
    period-ticks: 8
  volcano:
    enabled: true
    period-ticks: 10
    temporary-lava-ticks: 60
  blizzard:
    enabled: true
    period-ticks: 8
    temporary-snow-ticks: 80
  drought:
    enabled: true
    period-ticks: 20
    temporary-dry-ticks: 100
  meteor:
    enabled: true
    period-ticks: 14
    temporary-fire-ticks: 40
  tsunami:
    enabled: true
    period-ticks: 8
    temporary-water-ticks: 80
    wave-radius: 14
    flood-height: 2
