# Right-click mature crop to harvest; replants seed. Right-click farmland with seed to plant.
crops:
  wheat:
    seed: WHEAT_SEEDS
    crop-block: WHEAT
    mature-age: 7
    replant: true
    drops:
      - material: WHEAT
        min: 1
        max: 3
  carrot:
    seed: CARROT
    crop-block: CARROTS
    mature-age: 7
    replant: true
    drops:
      - material: CARROT
        min: 1
        max: 3
  potato:
    seed: POTATO
    crop-block: POTATOES
    mature-age: 7
    replant: true
    drops:
      - material: POTATO
        min: 1
        max: 3
  beetroot:
    seed: BEETROOT_SEEDS
    crop-block: BEETROOTS
    mature-age: 3
    replant: true
    drops:
      - material: BEETROOT
        min: 1
        max: 2
