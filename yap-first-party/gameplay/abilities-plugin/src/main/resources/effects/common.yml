# Status effect definitions for yap-abilities (V4 ambient VFX pass)
effects:
  poison:
    name: Poison
    kind: debuff
    duration-ticks: 100
    max-stacks: 3
    group: dot
    tick-interval: 20
    tick:
      - type: damage
        style: magic
        max-hit: 2
      - type: vfx
        particle: DUST
        shape: orb
        count: 8
        color: 80,200,60
        size: 1.0
        radius: 0.55
        offset-y: 0.8
      - type: vfx
        particle: WITCH
        shape: burst
        count: 4
        offset-y: 0.9

  burn:
    name: Burn
    kind: debuff
    duration-ticks: 80
    max-stacks: 2
    group: dot
    tick-interval: 15
    tick:
      - type: damage
        style: magic
        max-hit: 3
      - type: vfx
        particle: FLAME
        shape: helix
        count: 10
        radius: 0.45
        offset-y: 0.4
      - type: vfx
        particle: LAVA
        shape: burst
        count: 3
        offset-y: 1.0

  slow:
    name: Slow
    kind: debuff
    duration-ticks: 120
    max-stacks: 1
    tick-interval: 20
    tick:
      - type: vfx
        particle: DUST
        shape: ring
        count: 10
        color: 140,180,220
        size: 0.9
        radius: 0.55
        offset-y: 0.1
    modifiers:
      speed: 0.7

  weaken:
    name: Weaken
    kind: debuff
    duration-ticks: 160
    max-stacks: 2
    tick-interval: 25
    tick:
      - type: vfx
        particle: SMOKE
        shape: burst
        count: 5
        offset-y: 1.0
    modifiers:
      attack: -5
      strength: -5

  thick_skin:
    name: Thick Skin
    kind: buff
    duration-ticks: 600
    max-stacks: 1
    group: prayer_defence
