name: YaPAbilities
version: 1.0.0.0
main: com.yapcore.abilities.AbilitiesPlugin
api-version: '1.21'
folia-supported: true
authors: [ YaPcore ]
description: Config-driven ability engine — effects, projectiles, buffs, VFX
# YapSched is a shaded library (not a Bukkit plugin) — do not list it as depend.
softdepend: [ YaPSkills, YaPCombat ]
commands:
  ability:
    description: Cast or list abilities
    usage: /ability [list|cast|info] [id] [page]
    permission: yapabilities.use
  yapabilities:
    description: Admin reload for ability packs
    usage: /yapabilities reload
    permission: yapabilities.admin
permissions:
  yapabilities.use:
    default: true
  yapabilities.admin:
    default: op
