name: YaPAbilities
version: 1.0.0.0
main: com.yapcore.abilities.AbilitiesPlugin
api-version: '1.21'
folia-supported: true
authors: [ YaPcore ]
description: Config-driven ability engine — effects, projectiles, buffs, VFX
# YapSched is a shaded library (not a Bukkit plugin) — do not list it as depend.
softdepend: [ YaPSkills, YaPCombat ]
commands:
  ability:
    description: Cast, list, or bind abilities
    usage: /ability [list|book|bar|bind|cast|info|mode|tome] ...
    permission: yapabilities.use
  abilities:
    description: Open the ability book GUI
    usage: /abilities
    permission: yapabilities.use
  yapabilities:
    description: Admin reload and dashboard snapshot for ability packs
    usage: /yapabilities reload|snapshot json
    permission: yapabilities.admin
permissions:
  yapabilities.use:
    default: true
  yapabilities.bar:
    default: true
  yapabilities.admin:
    default: op
