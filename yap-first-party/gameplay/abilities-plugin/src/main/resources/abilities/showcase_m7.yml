# M7+ showcase abilities — rich VFX, animation, AoE, homing, chain
abilities:
  fireball_splash:
    name: "Fireball Splash"
    icon-cmd: 78010
    category: magic
    min-level:
      magic: 20
    costs:
      prayer: 3
      runes:
        BLAZE_POWDER: 2
        LAPIS_LAZULI: 2
    cooldown: 30
    range: 4
    target: area
    cast:
      - type: animation
        style: cast
        pulses: 2
        pose: glow
      - type: vfx
        particle: FLAME
        shape: helix
        count: 22
        radius: 1.2
      - type: vfx
        particle: DUST
        shape: ring
        count: 14
        color: 255,80,20
        size: 1.3
      - type: sound
        sound: ENTITY_BLAZE_SHOOT
        volume: 1.0
        pitch: 0.95
    on-hit:
      - type: damage
        style: magic
        max-hit: 12
      - type: vfx
        particle: LAVA
        shape: nova
        count: 18
        radius: 1.5
      - type: sound
        sound: ENTITY_GENERIC_EXPLODE
        volume: 0.7
        pitch: 1.2
      - type: debuff
        id: burn
        stacks: 1

  homing_arc:
    name: "Homing Arc"
    icon-cmd: 78011
    category: magic
    min-level:
      magic: 30
    costs:
      prayer: 4
    cooldown: 40
    target: raycast
    cast:
      - type: animation
        style: cast
        pose: glow
      - type: display
      - type: vfx
        particle: SOUL_FIRE_FLAME
        shape: ring
        count: 16
        color: 80,180,255
      - type: sound
        sound: ENTITY_ILLUSIONER_CAST_SPELL
    projectile:
      entity: SMALL_FIREBALL
      speed: 1.1
      homing: true
      turn-rate: 0.22
      splash-radius: 2.5
      max-ticks: 60
      hide: true
      scale: 1.05
      icon-cmd: 78011
      trail:
        particle: SOUL_FIRE_FLAME
        count: 6
        interval: 1
    on-hit:
      - type: damage
        style: magic
        max-hit: 14
      - type: vfx
        particle: SOUL
        shape: nova
        count: 20
        radius: 1.4
      - type: sound
        sound: ENTITY_GENERIC_EXPLODE
        pitch: 1.4

  chain_lightning:
    name: "Chain Lightning"
    icon-cmd: 78012
    category: magic
    min-level:
      magic: 40
    costs:
      prayer: 5
    cooldown: 50
    target: raycast
    conditions:
      - type: requires_mainhand
        material: BLAZE_ROD
    cast:
      - type: animation
        style: channel
        pulses: 4
        pose: glow
      - type: vfx
        particle: ELECTRIC_SPARK
        shape: helix
        count: 28
        radius: 1.0
        ticks: 10
        interval: 2
      - type: sound
        sound: ENTITY_LIGHTNING_BOLT_THUNDER
        volume: 0.55
        pitch: 1.6
    on-hit:
      - type: chain
        style: magic
        max-hit: 10
        jumps: 4
        radius: 6
      - type: vfx
        particle: ELECTRIC_SPARK
        shape: beam
        count: 16
        radius: 4

  ground_slam:
    name: "Ground Slam"
    icon-cmd: 78013
    category: melee
    min-level:
      attack: 35
      strength: 35
    cooldown: 60
    range: 3.5
    target: ground
    conditions:
      - type: on_ground
    cast:
      - type: animation
        style: slam
        pose: glow
      - type: delay
        ticks: 4
      - type: vfx
        particle: BLOCK
        shape: nova
        block: DIRT
        count: 24
        radius: 2.2
        offset-y: 0.1
      - type: sound
        sound: ENTITY_IRON_GOLEM_ATTACK
        volume: 1.1
    on-hit:
      - type: damage
        style: melee
        max-hit: 8
      - type: vfx
        particle: EXPLOSION
        shape: ring
        count: 14
        radius: 2.0
      - type: knockback
        power: 0.5

  meteor_strike:
    name: "Meteor Strike"
    icon-cmd: 78015
    category: magic
    min-level:
      magic: 50
    costs:
      prayer: 6
    cooldown: 80
    target: raycast
    cast:
      - type: animation
        style: cast
        pulses: 3
        pose: glow
      - type: vfx
        particle: FLAME
        shape: helix
        count: 30
        radius: 1.4
      - type: sound
        sound: ENTITY_BLAZE_SHOOT
      - type: delay
        ticks: 6
      - type: vfx
        particle: LAVA
        shape: beam
        count: 20
        radius: 8
    on-hit:
      - type: aoe
        radius: 4
        style: magic
        max-hit: 16
        particle: FLAME
        shape: nova
        count: 28
      - type: sound
        sound: ENTITY_GENERIC_EXPLODE
        volume: 1.0
        pitch: 0.85

  aerial_strike:
    name: "Aerial Strike"
    icon-cmd: 78014
    category: melee
    min-level:
      attack: 25
    cooldown: 25
    target: raycast
    conditions:
      - type: in_air
    cast:
      - type: animation
        style: slam
      - type: vfx
        particle: SWEEP_ATTACK
        shape: ring
        count: 12
        radius: 1.0
      - type: sound
        sound: ENTITY_PLAYER_ATTACK_SWEEP
    on-hit:
      - type: damage
        style: melee
        max-hit: 12
      - type: vfx
        particle: CRIT
        shape: nova
        count: 16
      - type: knockback
        power: 0.45
