# M7 showcase abilities — AoE, homing, chain, conditions, animation
abilities:
  fireball_splash:
    name: "Fireball Splash"
    category: magic
    icon-cmd: 78010
    min-level:
      magic: 20
    costs:
      prayer: 3
      runes:
        BLAZE_POWDER: 2
        LAPIS_LAZULI: 2
    cooldown: 30
    range: 4
    target: area
    cast:
      - type: animation
        style: swing
      - type: vfx
        particle: FLAME
        count: 16
      - type: sound
        sound: ENTITY_BLAZE_SHOOT
    on-hit:
      - type: damage
        style: magic
        max-hit: 12
      - type: debuff
        id: burn
        stacks: 1

  homing_arc:
    name: "Homing Arc"
    category: magic
    icon-cmd: 78011
    min-level:
      magic: 30
    costs:
      prayer: 4
    cooldown: 40
    target: raycast
    cast:
      - type: animation
        style: swing
      - type: display
    projectile:
      entity: SMALL_FIREBALL
      speed: 1.1
      homing: true
      turn-rate: 0.22
      splash-radius: 2.5
      max-ticks: 60
      icon-cmd: 78011
      trail:
        particle: SOUL_FIRE_FLAME
        count: 4
        interval: 2
    on-hit:
      - type: damage
        style: magic
        max-hit: 14

  chain_lightning:
    name: "Chain Lightning"
    category: magic
    icon-cmd: 78012
    min-level:
      magic: 40
    costs:
      prayer: 5
    cooldown: 50
    target: raycast
    conditions:
      - type: requires_mainhand
        material: BLAZE_ROD
    cast:
      - type: animation
        style: both
      - type: vfx
        particle: ELECTRIC_SPARK
        count: 20
    on-hit:
      - type: chain
        style: magic
        max-hit: 10
        jumps: 4
        radius: 6

  ground_slam:
    name: "Ground Slam"
    category: melee
    icon-cmd: 78013
    min-level:
      attack: 35
      strength: 35
    cooldown: 60
    range: 3.5
    target: ground
    conditions:
      - type: on_ground
    cast:
      - type: animation
        style: swing
    on-hit:
      - type: damage
        style: melee
        max-hit: 8
      - type: knockback
        power: 0.5

  meteor_strike:
    name: "Meteor Strike"
    category: magic
    icon-cmd: 78015
    min-level:
      magic: 50
    costs:
      prayer: 6
    cooldown: 80
    target: raycast
    cast:
      - type: animation
        style: swing
    on-hit:
      - type: aoe
        radius: 4
        style: magic
        max-hit: 16
        particle: FLAME

  aerial_strike:
    name: "Aerial Strike"
    category: melee
    icon-cmd: 78014
    min-level:
      attack: 25
    cooldown: 25
    target: raycast
    conditions:
      - type: in_air
    cast:
      - type: animation
        style: swing
      - type: vfx
        particle: SWEEP_ATTACK
        count: 8
    on-hit:
      - type: damage
        style: melee
        max-hit: 12
      - type: knockback
        power: 0.45
