enabled: true
tick-interval: 10
default-range: 20.0

# Cast gates — skill level is always required. Item/prayer costs are off by default
# so spells cast with level alone (no runes, staff, or prayer drain).
costs:
  require-runes: false
  require-staff: false
  require-prayer: false

# Folia multi-region spam safety — caps + no sync teleport follow loops
# V4: tuned for denser V2/V3 cast layers; raise only after soak if needed.
folia-safe:
  max-cast-icons-per-player: 4
  max-cast-icons-global: 48
  max-projectiles-per-player: 14
  max-projectiles-global: 112
  # Soft guidance for content authors (not enforced in code):
  # - Prefer at:/interval over entity spam
  # - Hero splash-radius should stay ≤ 6 under crowded fights

# Dual hotbar — build page (9 vanilla slots) vs combat page (1–3 weapons, 4–9 ability casts)
ability-bar:
  enabled: true
  dual-hotbar: true
  default-mode: build
  first-key: 4
  slot-count: 6
  sync-icons: true
  cast-on-right-click: true
  swap-cooldown-ms: 250
  # Swap triggers (any/all): PICK_BLOCK = middle mouse · SWAP_HANDS = F (rebind in Controls)
  # · SNEAK_DROP = sneak+Q · also /ability mode
  swap-triggers:
    - PICK_BLOCK
    - SNEAK_DROP

# Ability book — GUI spellbook to drag abilities onto combat bar keys 4–9
ability-book:
  enabled: true
  title: "Ability Book"
  abilities-per-page: 21
  show-locked: true
  open-triggers:
    - COMMAND       # /ability book · /abilities
    - TOME          # right-click Ability Tome item
    - SNEAK_SWAP    # sneak + swap hands (F) — ability book hotkey
  tome:
    enabled: true
    material: ENCHANTED_BOOK
    custom-model-data: 79100
    display-name: "§dAbility Tome"
    lore:
      - "§7Right-click to open your ability book"
      - "§8Drag spells onto combat keys §f4–9"
    give-on-first-join: true
