enabled: true

# Shared MariaDB via YaPDB when available
use-shared-yapdb: true

jdbc:
  url: jdbc:mysql://127.0.0.1:3306/yap_playerdata?useSSL=false&allowPublicKeyRetrieval=true
  user: yap
  password: change-me

pool:
  maximum-pool-size: 6
  minimum-idle: 1
  connection-timeout-ms: 10000

xp-table:
  max-level: 120
  multiplier: 1.0

# First-class overall player level (stored XP in yap_player_overall).
# Cap matches skills (120); skill XP also feeds overall at xp-share.
overall:
  max-level: 120
  xp-share: 0.5
  # When a skill is maxed, actions still feed overall (higher share).
  maxed-xp-share: 0.75
  multiplier: 1.0

feedback:
  action-bar-xp: true
  level-up-title: true
  level-up-chat: true
  level-up-sound: true

# When true, legacy playerdata jobs should stay disabled (features.jobs: false)
prefer-over-jobs: true

skills-directory: skills

# Power sits on top of the level locks. Level 1 is vanilla.
# At max level (120): 3x break speed, two extra drop copies (3x loot), 3x hit damage, 2x walk speed,
# +1 block place reach, 25% keep-block, +5 hearts, 2x brew speed.
# Super Breaker / Tree Feller / Green Terra / excavation loot unlock at 120 (abilities are timed, not always-on).
power:
  enabled: true
  break-speed-bonus-at-max: 2.0
  extra-drops-at-max: 2.0
  damage-bonus-at-max: 2.0
  movement-speed-bonus-at-max: 1.0
  place-reach-bonus-at-max: 1.0
  keep-block-chance-at-max: 0.25
  extra-hearts-at-max: 10.0
  brew-speed-bonus-at-max: 1.0
  abilities:
    duration-seconds: 12
    cooldown-seconds: 90
    super-breaker-speed: 8.0
    tree-feller-max-logs: 32
    green-terra: true
    excavation-treasure: true
    health-regen-interval-ticks: 80
    health-regen-hp: 1.0
