enabled: true

# Shared MariaDB via YaPDB when available
use-shared-yapdb: true

jdbc:
  url: jdbc:mysql://127.0.0.1:3306/yap_playerdata?useSSL=false&allowPublicKeyRetrieval=true
  user: yap
  password: change-me

pool:
  maximum-pool-size: 6
  minimum-idle: 1
  connection-timeout-ms: 10000

xp-table:
  max-level: 120
  multiplier: 1.0

# First-class overall player level (stored XP in yap_player_overall).
# Cap matches skills (120); skill XP also feeds overall at xp-share.
overall:
  max-level: 120
  xp-share: 0.5
  # When a skill is maxed, actions still feed overall (higher share).
  maxed-xp-share: 0.75
  multiplier: 1.0

feedback:
  action-bar-xp: true
  level-up-title: true
  level-up-chat: true

# When true, legacy playerdata jobs should stay disabled (features.jobs: false)
prefer-over-jobs: true

skills-directory: skills

# Power sits on top of the level locks. Level 1 is vanilla.
# At max level (120): break speed 2.5x, one extra copy of each drop, hits deal 2x damage.
# Mining only speeds and multiplies mining blocks. Woodcutting only speeds and multiplies wood.
# Strength only changes hit damage. Fortune and silk touch still apply before the extra copy.
power:
  enabled: true
  break-speed-bonus-at-max: 1.5
  extra-drops-at-max: 1.0
  damage-bonus-at-max: 1.0
