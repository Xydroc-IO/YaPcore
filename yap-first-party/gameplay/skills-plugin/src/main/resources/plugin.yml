name: YaPSkills
version: 1.0.0.0
main: com.yapcore.skills.SkillsPlugin
api-version: '1.21'
folia-supported: true
description: YaP MMO skills — Folia-native progression (13 RS-style skills)
authors: [YapLabs]
depend: []
softdepend: [YaPDB, PlaceholderAPI]
commands:
  skills:
    description: Open skills menu or inspect another player
    usage: /skills [player]
  skill:
    description: Skill admin and leaderboard commands
    usage: /skill addxp|set|top <player|skill> ...
  yskills:
    description: Reload YaPSkills
    usage: /yskills reload
permissions:
  yapskills.use:
    description: Open /skills and gain skill XP
    default: true
  yapskills.others:
    description: View another player's skills
    default: op
  yapskills.admin:
    description: /skill addxp, /skill set, /yskills reload
    default: op
