name: YaPSkills
version: 0.0.0.2
main: com.yapcore.skills.SkillsPlugin
api-version: '1.21'
folia-supported: true
description: Mining, woodcutting, strength, marathon, builder, herbalism, excavation, alchemy, and health.
authors: [YapLabs]
depend: []
softdepend: [YaPDB, PlaceholderAPI]
commands:
  skills:
    description: Open your skills / stats menu
    usage: /skills [player]
    aliases: [stats, skillstats, yapskills]
  skill:
    description: Skill admin and leaderboard commands
    usage: /skill addxp|set|top <player|skill> ...
  yskills:
    description: Reload YaPSkills
    usage: /yskills reload
permissions:
  yapskills.use:
    description: Open /skills and gain skill XP
    default: true
  yapskills.others:
    description: View another player's skills
    default: op
  yapskills.admin:
    description: /skill addxp, /skill set, /yskills reload
    default: op
