enabled: true
arenas-directory: arenas
modes-directory: modes
kits-file: kits.yml
lobby-world: world
countdown-seconds: 10
reset-drops: true

use-shared-yapdb: true
jdbc:
  url: jdbc:mysql://127.0.0.1:3306/yap_playerdata?useSSL=false&allowPublicKeyRetrieval=true
  user: yap
  password: change-me
pool:
  maximum-pool-size: 4
  minimum-idle: 1
  connection-timeout-ms: 10000

match:
  block-skill-xp: true
  enforce-arena-boundary: true
  spectators-on-elimination: true
  scoreboard: true
  countdown-titles: true

rewards:
  enabled: true
  ffa-win: 25.0
  duel-win: 10.0

signs:
  enabled: true
  lines:
    - '[Queue]'
    - '%mode%'
