# starter_chain — generated by scripts/content/generate-mmo-baseline-pack.py

quests:
  starter_mine:
    name: "First Strike"
    description: "Mine iron ore to learn gathering."
    objectives:
      - id: mine_iron
        type: GATHER
        material: IRON_ORE
        amount: 5
    rewards:
      - skill_xp:mining:100

  starter_smelt:
    name: "Hot Metal"
    description: "Gather coal for smelting."
    requires: starter_mine
    objectives:
      - id: coal
        type: GATHER
        material: COAL_ORE
        amount: 3
    rewards:
      - skill_xp:mining:75
      - skill_xp:smithing:75

  starter_craft:
    name: "Apprentice Smith"
    description: "Craft an iron dagger."
    requires: starter_smelt
    objectives:
      - id: dagger
        type: CRAFT_ITEM
        recipe: iron_dagger
        amount: 1
    rewards:
      - skill_xp:smithing:150
      - unlock_recipe:iron_sword

  starter_boss:
    name: "Crown of the Goblin"
    description: "Slay the Goblin King."
    requires: starter_craft
    objectives:
      - id: gk
        type: KILL_BOSS
        boss-id: goblin_king
        amount: 1
    rewards:
      - skill_xp:attack:100
      - skill_xp:strength:100
      - money:50

  starter_fish:
    name: "River's Bounty"
    description: "Fish and reach fishing level 5."
    requires: starter_boss
    objectives:
      - id: cod
        type: GATHER
        material: COD
        amount: 3
      - id: fish_lvl
        type: SKILL_LEVEL
        skill: fishing
        level: 5
    rewards:
      - skill_xp:fishing:150
      - teleport_unlock:fishing_spot
