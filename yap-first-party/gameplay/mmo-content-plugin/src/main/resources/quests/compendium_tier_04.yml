# Tier 4 — The Master Craftsman
# YaP MMO Quest Compendium — YaP-Folia / YaPSkills / YaP bosses

quests:
  t4_master_miner:
    name: "Master Miner"
    description: "Reach Mining Level 50 (YaPSkills)."
    requires: t3_attack25
    objectives:
      - id: mine50
        type: SKILL_LEVEL
        skill: mining
        level: 50
    rewards:
      - skill_xp:mining:15000
      - item:NETHERITE_PICKAXE:1
      - permission:yap.mmo.title.bedrock_breaker

  t4_master_lumber:
    name: "Master Lumberjack"
    description: "Reach Woodcutting Level 50."
    requires: t4_master_miner
    objectives:
      - id: wc50
        type: SKILL_LEVEL
        skill: woodcutting
        level: 50
    rewards:
      - skill_xp:woodcutting:15000
      - item:NETHERITE_AXE:1
      - permission:yap.mmo.title.tree_feller

  t4_dragon:
    name: "The Dragon Slayer"
    description: "Kill the Ender Dragon."
    requires: t4_master_lumber
    objectives:
      - id: dragon
        type: KILL_MOB
        entity: ENDER_DRAGON
        amount: 1
    rewards:
      - skill_xp:attack:50000
      - item:ELYTRA:1
      - group:dragon_slayer
      - permission:yap.mmo.title.dragon_slayer

  t4_wither:
    name: "Wither Destruction"
    description: "Kill the Wither Boss."
    requires: t4_dragon
    objectives:
      - id: wither
        type: KILL_MOB
        entity: WITHER
        amount: 1
    rewards:
      - skill_xp:attack:40000
      - item:NETHER_STAR:1
      - item:BONE_BLOCK:8

  t4_raid:
    name: "Raid Leader"
    description: "Kill 50 Pillagers (raid wave proxy)."
    requires: t4_wither
    objectives:
      - id: pillagers
        type: KILL_MOB
        entity: PILLAGER
        amount: 50
    rewards:
      - skill_xp:attack:20000
      - item:TOTEM_OF_UNDYING:3

  t4_deep_dark:
    name: "The Deep Dark"
    description: "Break 64 Sculk carefully in the Deep Dark."
    requires: t4_raid
    objectives:
      - id: sculk
        type: GATHER
        material: SCULK
        amount: 64
    rewards:
      - skill_xp:mining:25000
      - item:SCULK_CATALYST:10

  t4_warden:
    name: "Warden's Bane"
    description: "Kill the Warden."
    requires: t4_deep_dark
    objectives:
      - id: warden
        type: KILL_MOB
        entity: WARDEN
        amount: 1
    rewards:
      - skill_xp:attack:100000
      - item:ECHO_SHARD:8
      - item:NETHERITE_HELMET:1

  t4_tycoon:
    name: "Economic Tycoon"
    description: "Craft 50 iron swords for trade stock (economy proxy)."
    requires: t4_warden
    objectives:
      - id: trade_stock
        type: CRAFT_ITEM
        recipe: iron_sword
        amount: 50
    rewards:
      - skill_xp:smithing:30000
      - money:10000
      - item:GOLD_BLOCK:4

  t4_fish_legend:
    name: "Fisherman's Tale"
    description: "Reach Fishing Level 50 and catch 64 Cod."
    requires: t4_tycoon
    objectives:
      - id: fish50
        type: SKILL_LEVEL
        skill: fishing
        level: 50
      - id: cod64
        type: GATHER
        material: COD
        amount: 64
    rewards:
      - skill_xp:fishing:20000
      - item:FISHING_ROD:1

  t4_architect:
    name: "Architect's Dream"
    description: "Gather 10000 Cobblestone while building."
    requires: t4_fish_legend
    objectives:
      - id: build
        type: GATHER
        material: COBBLESTONE
        amount: 10000
    rewards:
      - skill_xp:crafting:25000
      - permission:yap.mmo.flight_token
      - money:500

  t4_void_shade:
    name: "Void Shade"
    description: "Slay the Void Shade boss."
    requires: t4_architect
    objectives:
      - id: vs
        type: KILL_BOSS
        boss-id: void_shade
        amount: 1
    rewards:
      - skill_xp:magic:12000
      - money:400

  t4_leviathan:
    name: "Deep Leviathan"
    description: "Slay the Deep Leviathan boss."
    requires: t4_void_shade
    objectives:
      - id: dl
        type: KILL_BOSS
        boss-id: deep_leviathan
        amount: 1
    rewards:
      - skill_xp:strength:15000
      - money:500

  t4_lich:
    name: "Crypt Lich"
    description: "Slay the Crypt Lich boss."
    requires: t4_leviathan
    objectives:
      - id: cl
        type: KILL_BOSS
        boss-id: crypt_lich
        amount: 1
    rewards:
      - skill_xp:magic:15000
      - money:500

  t4_ember:
    name: "Ember Drake"
    description: "Slay the Ember Drake boss."
    requires: t4_lich
    objectives:
      - id: ed
        type: KILL_BOSS
        boss-id: ember_drake
        amount: 1
    rewards:
      - skill_xp:attack:18000
      - money:600

  t4_hive:
    name: "Hive Queen"
    description: "Slay the Hive Queen boss."
    requires: t4_ember
    objectives:
      - id: hq
        type: KILL_BOSS
        boss-id: hive_queen
        amount: 1
    rewards:
      - skill_xp:ranged:18000
      - money:600

