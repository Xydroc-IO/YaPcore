# Tier 5 — The Legendary Hero
# YaP MMO Quest Compendium — YaP-Folia / YaPSkills / YaP bosses

quests:
  t5_full_enchant:
    name: "Full Enchantment"
    description: "Enchant items at an enchanting table 16 times."
    requires: t4_hive
    objectives:
      - id: enchant16
        type: ENCHANT
        amount: 16
    rewards:
      - skill_xp:magic:50000
      - item:ENCHANTED_GOLDEN_APPLE:5

  t5_collector:
    name: "The Collector"
    description: "Kill 50 Creepers while hunting music discs."
    requires: t5_full_enchant
    objectives:
      - id: creepers
        type: KILL_MOB
        entity: CREEPER
        amount: 50
    rewards:
      - skill_xp:defence:75000
      - item:JUKEBOX:1
      - item:MUSIC_DISC_CAT:1

  t5_beacon:
    name: "Beacon Power"
    description: "Smelt iron 164 times via YaPCrafting (smelt_iron) for beacon pyramid iron."
    requires: t5_collector
    objectives:
      - id: beacon_iron
        type: CRAFT_ITEM
        recipe: smelt_iron
        amount: 164
    rewards:
      - skill_xp:smithing:60000
      - item:BEACON:1

  t5_nether_biomes:
    name: "Nether Conqueror"
    description: "Kill 30 Hoglins across Nether biomes."
    requires: t5_beacon
    objectives:
      - id: hoglin
        type: KILL_MOB
        entity: HOGLIN
        amount: 30
    rewards:
      - skill_xp:attack:40000
      - item:NETHERITE_BOOTS:1

  t5_shulker:
    name: "End City Loot"
    description: "Kill 32 Shulkers."
    requires: t5_nether_biomes
    objectives:
      - id: shulker
        type: KILL_MOB
        entity: SHULKER
        amount: 32
    rewards:
      - skill_xp:magic:50000
      - item:SHULKER_SHELL:32
      - item:SHULKER_BOX:1

  t5_hydra:
    name: "Mythic Slayer: Hydra"
    description: "Kill Swamp Hydra (YaP multi-head boss)."
    requires: t5_shulker
    objectives:
      - id: hydra
        type: KILL_BOSS
        boss-id: swamp_hydra
        amount: 1
    rewards:
      - skill_xp:attack:150000
      - item:DIAMOND_SWORD:1
      - money:2000

  t5_void_lord:
    name: "Mythic Slayer: Void Lord"
    description: "Kill Void Shade (documented Void Lord stand-in boss-id: void_shade)."
    requires: t5_hydra
    objectives:
      - id: vl
        type: KILL_BOSS
        boss-id: void_shade
        amount: 1
    rewards:
      - skill_xp:magic:200000
      - item:ELYTRA:1
      - permission:yap.mmo.cosmetic.void_cape

  t5_potion:
    name: "Potion Master"
    description: "Mix attack potion 100 times (herblore)."
    requires: t5_void_lord
    objectives:
      - id: pots
        type: CRAFT_ITEM
        recipe: mix_attack_potion
        amount: 100
    rewards:
      - skill_xp:magic:30000
      - item:BREWING_STAND:1

  t5_anvil:
    name: "Anvil God"
    description: "Take a result from an anvil 50 times (repair, rename, or combine)."
    requires: t5_potion
    objectives:
      - id: anvil50
        type: ANVIL_USE
        amount: 50
    rewards:
      - skill_xp:smithing:40000
      - item:ENCHANTED_BOOK:3

  t5_speedster:
    name: "Speedster"
    description: "Reach Defence Level 75 (Agility skill not shipped — Defence is the intentional stand-in)."
    requires: t5_anvil
    objectives:
      - id: def75
        type: SKILL_LEVEL
        skill: defence
        level: 75
    rewards:
      - skill_xp:defence:50000
      - item:DIAMOND_BOOTS:1
      - permission:yap.mmo.title.hermes

  t5_juggernaut:
    name: "Iron Juggernaut"
    description: "Slay the Iron Juggernaut boss."
    requires: t5_speedster
    objectives:
      - id: ij
        type: KILL_BOSS
        boss-id: iron_juggernaut
        amount: 1
    rewards:
      - skill_xp:strength:80000
      - money:1500

  t5_shadow:
    name: "Shadow Assassin"
    description: "Slay the Shadow Assassin boss."
    requires: t5_juggernaut
    objectives:
      - id: sa
        type: KILL_BOSS
        boss-id: shadow_assassin
        amount: 1
    rewards:
      - skill_xp:attack:80000
      - money:1500

  t5_golem:
    name: "Ancient Golem"
    description: "Slay the Ancient Golem boss."
    requires: t5_shadow
    objectives:
      - id: ag
        type: KILL_BOSS
        boss-id: ancient_golem
        amount: 1
    rewards:
      - skill_xp:defence:90000
      - money:1800

  t5_plague:
    name: "Plague Rat King"
    description: "Slay the Plague Rat King boss."
    requires: t5_golem
    objectives:
      - id: prk
        type: KILL_BOSS
        boss-id: plague_rat_king
        amount: 1
    rewards:
      - skill_xp:hitpoints:70000
      - money:1600

  t5_storm:
    name: "Storm Elemental"
    description: "Slay the Storm Elemental boss."
    requires: t5_plague
    objectives:
      - id: se
        type: KILL_BOSS
        boss-id: storm_elemental
        amount: 1
    rewards:
      - skill_xp:magic:90000
      - money:1800

