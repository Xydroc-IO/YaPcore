# Tier 3 — The Elite Guardian
# YaP MMO Quest Compendium — YaP-Folia / YaPSkills / YaP bosses

quests:
  t3_diamond:
    name: "Diamond Dreams"
    description: "Mine 10 Diamond Ore."
    requires: t2_stone_titan
    objectives:
      - id: dia
        type: GATHER
        material: DIAMOND_ORE
        amount: 10
    rewards:
      - skill_xp:mining:3000
      - item:DIAMOND_PICKAXE:1

  t3_dragon_breath:
    name: "The Dragon's Breath"
    description: "Kill 5 Ghasts while preparing for the End."
    requires: t3_diamond
    objectives:
      - id: ghasts
        type: KILL_MOB
        entity: GHAST
        amount: 5
    rewards:
      - skill_xp:ranged:4000
      - item:GLASS_BOTTLE:8
      - item:GHAST_TEAR:2

  t3_goblin_king:
    name: "Defeat the Goblin King"
    description: "Kill Goblin King (YaP boss)."
    requires: t3_dragon_breath
    objectives:
      - id: gk
        type: KILL_BOSS
        boss-id: goblin_king
        amount: 1
    rewards:
      - skill_xp:attack:5000
      - item:GOLD_INGOT:64
      - item:GOLDEN_HELMET:1
      - money:250

  t3_debris:
    name: "Netherite Ambition"
    description: "Mine 1 Ancient Debris."
    requires: t3_goblin_king
    objectives:
      - id: debris
        type: GATHER
        material: ANCIENT_DEBRIS
        amount: 1
    rewards:
      - skill_xp:mining:6000
      - item:NETHERITE_UPGRADE_SMITHING_TEMPLATE:1

  t3_netherite:
    name: "Full Netherite"
    description: "Reach Smithing Level 40 (full netherite set proxy)."
    requires: t3_debris
    objectives:
      - id: smith40
        type: SKILL_LEVEL
        skill: smithing
        level: 40
    rewards:
      - skill_xp:smithing:10000
      - group:guardian
      - permission:yap.mmo.title.guardian

  t3_undead:
    name: "The Undead Army"
    description: "Kill 100 Skeletons."
    requires: t3_netherite
    objectives:
      - id: army
        type: KILL_MOB
        entity: SKELETON
        amount: 100
    rewards:
      - skill_xp:attack:5000
      - item:SADDLE:1

  t3_elder:
    name: "Ocean Conqueror"
    description: "Kill an Elder Guardian."
    requires: t3_undead
    objectives:
      - id: elder
        type: KILL_MOB
        entity: ELDER_GUARDIAN
        amount: 1
    rewards:
      - skill_xp:defence:6000
      - item:WET_SPONGE:5

  t3_mansion:
    name: "Woodland Explorer"
    description: "Kill 20 Vindicators (Woodland Mansion)."
    requires: t3_elder
    objectives:
      - id: vind
        type: KILL_MOB
        entity: VINDICATOR
        amount: 20
    rewards:
      - skill_xp:attack:7000
      - item:TOTEM_OF_UNDYING:1

  t3_witch:
    name: "The Witch's Brew"
    description: "Kill 10 Witches."
    requires: t3_mansion
    objectives:
      - id: witch
        type: KILL_MOB
        entity: WITCH
        amount: 10
    rewards:
      - skill_xp:magic:5000
      - item:GLOWSTONE_DUST:16
      - item:POTION:3

  t3_guild:
    name: "Guild Initiate"
    description: "Create or join a YaP Guild, then talk to the Guild Clerk NPC."
    requires: t3_witch
    objectives: []
    rewards:
      - skill_xp:attack:5000
      - money:200
      - permission:yap.guild.claim_bonus

  t3_frost:
    name: "Frost Brute"
    description: "Slay the Frost Brute boss."
    requires: t3_guild
    objectives:
      - id: fb
        type: KILL_BOSS
        boss-id: frost_brute
        amount: 1
    rewards:
      - skill_xp:defence:3500
      - money:150

  t3_magma_hound:
    name: "Magma Hound"
    description: "Slay the Magma Hound boss."
    requires: t3_frost
    objectives:
      - id: mh
        type: KILL_BOSS
        boss-id: magma_hound
        amount: 1
    rewards:
      - skill_xp:attack:3500
      - money:150

  t3_thorn:
    name: "Thorn Matriarch"
    description: "Slay the Thorn Matriarch boss."
    requires: t3_magma_hound
    objectives:
      - id: tm
        type: KILL_BOSS
        boss-id: thorn_matriarch
        amount: 1
    rewards:
      - skill_xp:ranged:4000
      - money:175

  t3_sand:
    name: "Sand Colossus"
    description: "Slay the Sand Colossus boss."
    requires: t3_thorn
    objectives:
      - id: sc
        type: KILL_BOSS
        boss-id: sand_colossus
        amount: 1
    rewards:
      - skill_xp:strength:4000
      - money:175

  t3_attack25:
    name: "Battle Hardened"
    description: "Reach Attack Level 25."
    requires: t3_sand
    objectives:
      - id: atk25
        type: SKILL_LEVEL
        skill: attack
        level: 25
    rewards:
      - skill_xp:attack:5000
      - item:DIAMOND_SWORD:1

