# Tier 1 — The Adventurer's Beginning
# YaP MMO Quest Compendium — YaP-Folia / YaPSkills / YaP bosses

quests:
  t1_first_steps:
    name: "First Steps"
    description: "Talk to the Mayor at the Quest Board NPC at spawn (right-click)."
    objectives:
      - id: talk_mayor
        type: TALK
        npc-id: mayor
        amount: 1
    rewards:
      - skill_xp:attack:50
      - item:BREAD:5
      - kit_unlock:adventurer

  t1_woodcutter:
    name: "Woodcutter's Initiation"
    description: "Collect 32 Oak Logs to learn gathering."
    requires: t1_first_steps
    objectives:
      - id: oak
        type: GATHER
        material: OAK_LOG
        amount: 32
    rewards:
      - skill_xp:woodcutting:100
      - item:STONE_AXE:1

  t1_stone_age:
    name: "Stone Age"
    description: "Mine 64 Cobblestone."
    requires: t1_woodcutter
    objectives:
      - id: cobble
        type: GATHER
        material: COBBLESTONE
        amount: 64
    rewards:
      - skill_xp:mining:100
      - item:STONE_PICKAXE:1

  t1_feeding:
    name: "Feeding the Village"
    description: "Cook beef via YaPCrafting (cook_beef) sixteen times."
    requires: t1_stone_age
    objectives:
      - id: steak
        type: CRAFT_ITEM
        recipe: cook_beef
        amount: 16
    rewards:
      - skill_xp:cooking:150
      - item:GOLDEN_CARROT:5

  t1_leather:
    name: "Leather Armor"
    description: "Craft a leather tunic (craft_leather_tunic)."
    requires: t1_feeding
    objectives:
      - id: tunic
        type: CRAFT_ITEM
        recipe: craft_leather_tunic
        amount: 1
    rewards:
      - skill_xp:crafting:200
      - item:EMERALD:10

  t1_first_hunt:
    name: "The First Hunt"
    description: "Kill 10 Zombies."
    requires: t1_leather
    objectives:
      - id: zombies
        type: KILL_MOB
        entity: ZOMBIE
        amount: 10
    rewards:
      - skill_xp:attack:250
      - item:IRON_SWORD:1

  t1_spider:
    name: "Spider Slayer"
    description: "Kill 5 Spiders."
    requires: t1_first_hunt
    objectives:
      - id: spiders
        type: KILL_MOB
        entity: SPIDER
        amount: 5
    rewards:
      - skill_xp:ranged:250
      - item:BOW:1
      - item:ARROW:16

  t1_cave:
    name: "Cave Explorer"
    description: "Mine deep — break 48 Deepslate while exploring caves near spawn."
    requires: t1_spider
    objectives:
      - id: deepslate
        type: GATHER
        material: DEEPSLATE
        amount: 48
    rewards:
      - skill_xp:mining:300
      - item:TORCH:32

  t1_iron_will:
    name: "Iron Will"
    description: "Smelt iron via YaPCrafting (smelt_iron) sixteen times."
    requires: t1_cave
    objectives:
      - id: smelt
        type: CRAFT_ITEM
        recipe: smelt_iron
        amount: 16
    rewards:
      - skill_xp:smithing:400
      - item:IRON_CHESTPLATE:1

  t1_farmer:
    name: "Farmer's Market"
    description: "Harvest 64 Wheat."
    requires: t1_iron_will
    objectives:
      - id: wheat
        type: GATHER
        material: WHEAT
        amount: 64
    rewards:
      - skill_xp:cooking:300
      - item:EMERALD:5
      - money:25

  t1_coal_run:
    name: "Coal for the Forge"
    description: "Mine 32 Coal Ore."
    requires: t1_farmer
    objectives:
      - id: coal
        type: GATHER
        material: COAL_ORE
        amount: 32
    rewards:
      - skill_xp:mining:200
      - item:COAL:16

  t1_sheep:
    name: "Wool Gatherer"
    description: "Collect 24 White Wool."
    requires: t1_coal_run
    objectives:
      - id: wool
        type: GATHER
        material: WHITE_WOOL
        amount: 24
    rewards:
      - skill_xp:crafting:150
      - item:SHEARS:1

  t1_skeleton:
    name: "Bone Collector"
    description: "Kill 8 Skeletons."
    requires: t1_sheep
    objectives:
      - id: skeles
        type: KILL_MOB
        entity: SKELETON
        amount: 8
    rewards:
      - skill_xp:defence:200
      - item:BONE:16

  t1_fishing_intro:
    name: "Cast a Line"
    description: "Catch 10 Cod and reach Fishing level 3."
    requires: t1_skeleton
    objectives:
      - id: cod
        type: GATHER
        material: COD
        amount: 10
      - id: fish_lvl
        type: SKILL_LEVEL
        skill: fishing
        level: 3
    rewards:
      - skill_xp:fishing:200
      - item:FISHING_ROD:1

  t1_mining_five:
    name: "First Steps in Mining"
    description: "Reach Mining Level 5 — unlock the mines warp."
    requires: t1_fishing_intro
    objectives:
      - id: mine_lvl
        type: SKILL_LEVEL
        skill: mining
        level: 5
    rewards:
      - skill_xp:mining:500
      - item:IRON_PICKAXE:1
      - teleport_unlock:mines

