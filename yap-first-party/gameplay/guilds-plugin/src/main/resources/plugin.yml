name: YaPGuilds
version: 1.0.0.0
main: com.yapcore.guilds.GuildsPlugin
api-version: '1.21'
folia-supported: true
description: MMO guilds — levels, perks, bank, chat, relations
authors: [YapLabs]
depend: [YaPDB]
softdepend: [YaPPlayerData, YaPSkills, PlaceholderAPI]
commands:
  g:
    description: Guild commands
    usage: /g help
  guild:
    description: Guild commands alias
    usage: /g help
  yapguilds:
    description: YaPGuilds admin
    usage: /yapguilds reload|snapshot
permissions:
  yapguilds.use:
    description: Basic guild commands
    default: true
  yapguilds.create:
    description: Create a guild
    default: true
  yapguilds.admin:
    description: /yapguilds admin commands
    default: op
