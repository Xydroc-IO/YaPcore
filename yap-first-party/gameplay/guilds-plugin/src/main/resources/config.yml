enabled: true

use-shared-yapdb: true

jdbc:
  url: jdbc:mysql://127.0.0.1:3306/yap_playerdata?useSSL=false&allowPublicKeyRetrieval=true
  user: yap
  password: change-me

pool:
  maximum-pool-size: 6
  minimum-idle: 1
  connection-timeout-ms: 10000

guild-xp:
  max-level: 50
  base-xp-to-level: 1000
  xp-growth: 1.15
  base-max-members: 5
  members-per-level: 1
  base-bank-cap: 10000
  bank-cap-per-level: 5000
  skill-level-up: 25
  boss-kill: 500
  online-tick: 1
  online-interval-minutes: 15

invites:
  expire-hours: 48

chat:
  guild-format: "§7[§dG§7] §f%tag% §7| §f%player%§7: §f%message%"
  officer-format: "§7[§6O§7] §f%tag% §7| §f%player%§7: §f%message%"
  ally-format: "§7[§bA§7] §f%tag% §7| §f%player%§7: §f%message%"

limits:
  name-min: 3
  name-max: 24
  tag-min: 2
  tag-max: 6
  description-max: 200
  motd-max: 200

bank:
  enabled: true
  min-deposit: 1.0
  min-withdraw: 1.0

perks:
  level-5: "+1 member slot"
  level-10: "Bank cap +25k"
  level-20: "Ally chat unlocked"
  level-30: "Guild hall prestige"
  level-50: "Legendary guild title"
