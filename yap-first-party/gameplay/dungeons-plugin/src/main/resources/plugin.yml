name: YaPDungeons
version: '1.0.0.0'
main: com.yapcore.dungeons.DungeonsPlugin
api-version: '1.21'
folia-supported: true
description: Instanced procedural dungeons (L1-50 + prestige 51-100)
authors: [YapLabs]
depend: []
softdepend: [YaPDB, YaPSkills, YaPWorld, YaPPlayerData, PlaceholderAPI]
commands:
  dungeon:
    description: Dungeon menu, invites, leave, status
    usage: /dungeon [invite|accept|deny|leave|lives|status|open]
    aliases: [dungeons, ydungeon]
    permission: yapdungeons.use
  yapdungeons:
    description: YaPDungeons admin
    usage: /yapdungeons reload|forcestop|giveportal
    permission: yapdungeons.admin
permissions:
  yapdungeons.use:
    description: Use dungeons
    default: true
  yapdungeons.admin:
    description: Admin dungeon controls
    default: op
  yapdungeons.portal.craft:
    description: Craft dungeon portal item
    default: true
  yapdungeons.portal.place:
    description: Place dungeon portal
    default: true
