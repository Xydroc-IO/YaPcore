name: YaPMmoBedrock
version: 1.0.0.0
main: com.yapcore.mmobedrock.MmoBedrockPlugin
api-version: '1.21'
folia-supported: true
description: Bedrock MMO UI — FormService skills panel, XP/combat sidebar, recipe/hiscore forms
authors: [YapLabs]
depend: [YaPBedrockUI]
softdepend: [YaPSkills, YaPCombat, YaPCrafting, YaPMmoContent, YaPFloodgate, YaPAbilities]
commands:
  mmoui:
    description: Open Bedrock MMO UI hub
    usage: /mmoui [skills|abilities|recipes|hiscores] [skill|category] [page]
    permission: yapmmo.bedrock.use
permissions:
  yapmmo.bedrock.use:
    description: Use Bedrock MMO forms (/mmoui, /skills redirect)
    default: true
