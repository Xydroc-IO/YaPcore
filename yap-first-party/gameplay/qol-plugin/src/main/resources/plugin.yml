name: YaP-QoL
version: '0.0.0.1'
main: com.yapcore.qol.QolPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: VIP QoL tools — timber axe + area excavator pickaxe (staff-granted)
website: https://github.com/yaplabs
commands:
  yapqol:
    description: Staff YaP-QoL — reload, give tools, open control GUI
    usage: /yapqol <reload|status|give <timber_axe|excavator|excavator:N> [player]|gui>
    aliases: [qol, yap-qol]
    permission: yapqol.admin
permissions:
  yapqol.timber:
    description: Use the timber axe (whole-tree chop) when holding it
    default: true
  yapqol.excavator:
    description: Use the area excavator pickaxe when holding it
    default: true
  yapqol.admin:
    description: Reload / toggle YaP-QoL and open /yapqol gui
    default: op
  yapqol.give:
    description: Give YaP-QoL tools to players
    default: op
  yapqol.gui:
    description: Open YaP-QoL staff GUI
    default: op
