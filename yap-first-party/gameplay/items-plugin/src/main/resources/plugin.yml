name: YaPItems
version: '0.0.0.1'
main: com.yapcore.items.ItemsPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Custom items registry — abilities, furniture, recipes, combat gear tags
website: https://github.com/yaplabs
softdepend: [YaPPlayerData, YaPSkills, PlaceholderAPI]
provides: [YaP-QoL]
commands:
  yapitems:
    description: YaPItems admin — give, take, list, create, gui, furniture
    usage: /yapitems <give|take|list|info|gui|reload|create|delete|cooldown|furniture>
    aliases: [yitems]
    permission: yapitems.use
  yapqol:
    description: Staff timber axe and excavator tools
    usage: /yapqol <reload|status|give <timber_axe|excavator|excavator:N> [player]|gui>
    aliases: [qol, yap-qol]
    permission: yapqol.admin
permissions:
  yapitems.use:
    description: Base YaPItems access (list/info; ungated item use)
    default: true
  yapitems.give:
    description: Give custom items
    default: op
  yapitems.take:
    description: Take custom items
    default: op
  yapitems.gui:
    description: Open items browser
    default: op
  yapitems.create:
    description: Create custom item definitions
    default: op
  yapitems.craft:
    description: Craft registered custom recipes
    default: true
  yapitems.admin:
    description: Full YaPItems admin (reload, create, delete, furniture) + all gated item/ability nodes
    default: op
    children:
      yapitems.give: true
      yapitems.take: true
      yapitems.gui: true
      yapitems.create: true
      yapitems.use: true
      yapitems.craft: true
  yapqol.timber:
    description: Use the timber axe when holding it
    default: true
  yapqol.excavator:
    description: Use the area excavator when holding it
    default: true
  yapqol.admin:
    description: Reload tool knobs and open /yapqol gui
    default: op
  yapqol.give:
    description: Give timber axe and excavator items
    default: op
  yapqol.gui:
    description: Open the tool staff GUI
    default: op
