# Example custom items (CMD 12000–12999). Original YaP art in resourcepacks/yap-items/.
# Abilities always get baked-in FX; params below tune the look. Set fx: false to mute.
stormblade:
  base: NETHERITE_SWORD
  name: "&bStormblade"
  lore:
    - "&7Crackling edge forged in sky-fire"
    - "&eRight-click: &flightning dash"
  custom-model-data: 12001
  unbreakable: true
  glow: true
  hide-flags: [ATTRIBUTES, ENCHANTS]
  enchants:
    sharpness: 5
    unbreaking: 3
  attributes:
    attack_damage: 10
    attack_speed: -2.4
  gear:
    attack: 8
    strength: 2
  ability:
    trigger: RIGHT_CLICK
    type: lightning_dash
    cooldown: 8s
    params:
      range: 8
      damage: 4
      particle: ELECTRIC_SPARK
      sound: ENTITY_LIGHTNING_BOLT_THUNDER
      count: 40
  recipe:
    type: shaped
    shape:
      - " D "
      - " D "
      - " S "
    ingredients:
      D: DIAMOND
      S: STICK
  consume: false

