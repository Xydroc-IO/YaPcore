name: YaPCombat
version: 1.0.0.0
main: com.yapcore.combat.CombatPlugin
api-version: '1.21'
folia-supported: true
description: YaP MMO custom combat — gear, food, potions, spells, prayer (M2+)
authors: [YapLabs]
depend: [YaPDB]
softdepend: [YaPSkills, YaPPlayerdata]
commands:
  combat:
    description: Combat stats and admin
    usage: /combat stats|reload
  yapcombat:
    description: YaPCombat admin
    usage: /yapcombat admin sethp <player> <hp>
  spells:
    description: List known magic spells
    usage: /spells
  cast:
    description: Cast a spell from your spell book
    usage: /cast <spell>
  prayer:
    description: Toggle RS-style prayers
    usage: /prayer list|on <id>|off [id]|clear
permissions:
  yapcombat.use:
    description: View /combat stats
    default: true
  yapcombat.cast:
    description: Cast spells via /cast
    default: true
  yapcombat.prayer:
    description: Toggle prayers via /prayer
    default: true
  yapcombat.admin:
    description: /combat reload, /yapcombat admin sethp
    default: op
