enabled: true

use-shared-yapdb: true

jdbc:
  url: jdbc:mysql://127.0.0.1:3306/yap?useSSL=false&allowPublicKeyRetrieval=true
  user: yap
  password: change-me

pool:
  maximum-pool-size: 6
  minimum-idle: 1
  connection-timeout-ms: 10000

# Custom HP model: internal integer HP with vanilla hearts scaled to ratio (see docs/MMO_COMBAT.md).
custom-hp:
  enabled: true
  hearts-display: 10
  base-hp: 100
  hp-per-hitpoints-level: 10

pvp: false

death:
  keep-inventory: false
  restore-hp-on-respawn: true

formula:
  level-factor: 0.5
  min-damage-on-hit: 1
  crit-chance: 0.05
  crit-multiplier: 1.5

combat:
  attack-cooldown-ticks: 4
  ranged-cooldown-ticks: 8
  skill-cache-ttl-ms: 5000

physics:
  knockback-enabled: true
  knockback-base: 0.15
  knockback-damage-scale: 0.25
  knockback-vertical: 0.12

xp:
  damage-multiplier: 4.0
  kill-base: 25.0
  attack-share: 0.25
  strength-share: 0.25
  defence-share: 0.25
  hitpoints-share: 0.25
  ranged-share: 0.5
  magic-share: 0.5

prayer:
  drain-interval-ticks: 20

food:
  cooldown-ticks: 3

potions:
  attack:
    material: POTION
    boost: 5
    duration-seconds: 120
    cooldown-seconds: 60
  strength:
    material: SPLASH_POTION
    boost: 5
    duration-seconds: 120
    cooldown-seconds: 60
  defence:
    material: LINGERING_POTION
    boost: 5
    duration-seconds: 120
    cooldown-seconds: 60

items-file: items.yml
food-file: food.yml
spells-file: spells.yml
prayers-file: prayers.yml
status-effects-file: status-effects.yml

combo:
  enabled: true
  window-ms: 3000
  max: 20
  bonus-per-stack: 0.03
  reset-on-miss: true

projectiles:
  enabled: true
  velocity-scale: 1.15
  gravity-multiplier: 0.92
  pierce-per-ranged-levels: 25
  drop-off-enabled: true
  drop-off-per-block: 0.004
  min-drop-off-multiplier: 0.55
  headshot-multiplier: 1.25

on-hit-procs:
  crit-bleed:
    trigger: crit
    effect: bleed
    chance: 0.4
    stacks: 1
  melee-weakness:
    trigger: melee
    effect: weakness
    chance: 0.08
    stacks: 1
  ranged-poison:
    trigger: ranged
    effect: poison
    chance: 0.12
    stacks: 1
