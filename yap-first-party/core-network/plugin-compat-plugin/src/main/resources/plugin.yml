name: YaPPluginCompat
version: '1.0.0.0'
main: com.yapcore.plugincompat.paper.YapPluginCompatPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Back-compat for Paper 1.20–1.21 plugins on YaPcore / Paper 26.2
load: STARTUP
commands:
  yapcompat:
    description: Show plugin back-compat status
    permission: yapcompat.status
    usage: /yapcompat
permissions:
  yapcompat.status:
    description: View plugin compat status
    default: op
