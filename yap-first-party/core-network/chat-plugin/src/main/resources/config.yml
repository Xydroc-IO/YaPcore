# YaP Chat — shipped defaults (typical SMP)
# Go public: see docs/start/SECRETS.md + DEFAULTS.md LAN vs public table
# Prefer dashboard: Plugin settings or Chat tab → Save → reload

# Offline / Link / Via cannot present Mojang chat keys. When true:
# formatted chat is a system packet, leftover player-chat is rewritten,
# and play-login advertises secure chat so the join toast is hidden.
unsigned-system-chat: true

# Default public channel
default-channel: global

# Channels — optional permission gates speak + hear
channels:
  global:
    format: "{prefix}{namecolor}{player}{suffix}&7: {chatcolor}{message}"
    radius: -1
  local:
    format: "&8[&aLocal&8] {prefix}{namecolor}{player}{suffix}&7: {chatcolor}{message}"
    radius: 100
  trade:
    format: "&8[&6Trade&8] {prefix}{namecolor}{player}{suffix}&7: {chatcolor}{message}"
    radius: -1
  staff:
    format: "&8[&bStaff&8] {prefix}{namecolor}{player}{suffix}&7: {chatcolor}{message}"
    radius: -1
    permission: yapchat.staff
  admin:
    format: "&8[&cAdmin&8] {prefix}{namecolor}{player}{suffix}&7: {chatcolor}{message}"
    radius: -1
    permission: yapchat.admin

# Prefix local chat with ! (one-shot without switching channel)
local-prefix: "!"

# Slow mode (seconds between messages). Typical public SMP uses 3; set 0 for LAN/dev.
slow-mode-seconds: 3

# Basic word filter (case-insensitive substring match)
filter:
  enabled: true
  mode: replace
  block-on-match: false
  words:
    - fuck
    - shit
    - bitch
    - asshole
    - nigger
    - nigga
    - retard
  replacement: "***"

messages:
  prefix: ""
  no-permission: "&cNo permission.&7 Need: &f{node}"
  players-only: "&cPlayers only."
  reloaded: "&a{plugin} reloaded."
  failed: "&c{reason}"
  muted: "&cYou are muted. &7({reason})"
  pm-sent: "&7[&dYou → {target}&7] &f{message}"
  pm-received: "&7[&d{sender} → You&7] &f{message}"
  staff-format: "&8[&bStaff&8] &f{player}&7: &f{message}"
  admin-format: "&8[&cAdmin&8] &f{player}&7: &f{message}"
  socialspy: "&8[Spy] &7{sender} → {target}: &f{message}"
  slow-mode: "&cSlow mode — wait {seconds}s."
  filtered: "&cMessage blocked by filter."
  channel-no-permission: "&cNo permission for &f{channel} &cchannel."
  unknown-channel: "&cUnknown channel. Try: &f{channels}"
  channel-set: "&aChat channel set to &f{channel}"
  player-offline: "&cPlayer not online."
  no-reply-target: "&cNo one to reply to."

server-id: lobby

network:
  enabled: true
  relay-channels:
    - global
    - trade
    - staff
    - admin
