# Shared MariaDB/MySQL — prefer YaPDB (yap-db.jar) when installed
use-shared-yapdb: true

# Used only when YaPDB is missing or use-shared-yapdb is false
jdbc:
  # Align with deploy/mariadb/.env.example. Prefer shared YaPDB + ./configure-db.sh.
  url: jdbc:mysql://127.0.0.1:3306/yap_playerdata?useSSL=false&allowPublicKeyRetrieval=true
  user: yap
  password: change-me

pool:
  maximum-pool-size: 8
  minimum-idle: 2
  connection-timeout-ms: 10000

# Unique id for this backend (must differ on every Velocity backend)
server-id: lobby

# Inventory / XP / vitals profile key:
#   global  — shared across all backends (default)
#   server  — use server-id (per-server / minigame wipe)
#   <name>  — custom shared group (e.g. survival-network)
inventory-profile: global

autosave-seconds: 60
starting-balance: 0.00
lock-ttl-seconds: 120

# Master money switch. false → no /bal /pay, Vault provider, shops/jobs/AH/traders,
# or claim tax (claims themselves can stay on). sync.economy is forced off.
economy:
  enabled: true

# Feature modules (freeze: no new Essentials-class commands without product review).
# shops + auctions on by default; NPC shop catalogs (features.traders) feed YaPNpcs /npc shop.
# jobs stay off (overlaps YaPSkills mining payouts). Money features also require economy.enabled=true.
features:
  homes: true
  warps: true
  kits: true
  mail: true
  shops: true
  jobs: false
  auctions: true
  claims: true
  traders: true
  backpack: true

# Extra storage (not the vanilla E inventory). 45 slots per page; bottom row is tabs.
# Rank extra pages: default 3, VIP .5, staff .7, admin yapdata.bag.pages.* (max).
backpack:
  default-pages: 3
  max-pages: 9

# Offline password auth (AuthMe-class). Session lock is separate (always on).
# LAN/demo default OFF so players join without /register. Enable for public offline-mode.
auth:
  enabled: false
  # true = always require /login even on online-mode servers
  force: false
  # true = skip auth when online-mode=false (Velocity modern forwarding backends)
  trust-velocity: false
  min-password-length: 4
  timeout-seconds: 60
  max-attempts: 5

sync:
  inventory: true
  enderchest: true
  xp: true
  vitals: true
  # Ignored when economy.enabled=false
  economy: true

homes:
  # Max /sethome slots per player (permission overrides may raise this later)
  max: 3

mail:
  max-unread: 50

auctions:
  expire-hours: 48
  fee-percent: 0

claims:
  # Legacy: also AND'd with features.claims
  enabled: true
  require-claim-to-build: false
  tool: GOLDEN_SHOVEL
  inspect-tool: STICK
  starting-blocks: 2500
  blocks-per-hour: 100
  min-area: 9
  max-area: 50000
  visual-seconds: 8
  subdivide-min-area: 4
  tax:
    # Forced off when economy.enabled=false
    enabled: true
    per-block-per-day: 0.01
    tick-minutes: 60
    freeze-at: 50.0
    abandon-at: 200.0
  default-flags:
    pvp: deny
    mob-damage: allow
    entry: allow
    fire-spread: deny
    mob-spawning: allow

# Kit definitions live in kits.yml (shared across Hub + survival backends).
# Optional overrides here still merge on reload. See docs/ops/TEBEX.md for store wiring.
# kits: {}

jobs:
  miner:
    display: Miner
    xp-per-action: 1.0
    break:
      COAL_ORE: 0.50
      DEEPSLATE_COAL_ORE: 0.50
      IRON_ORE: 1.00
      DEEPSLATE_IRON_ORE: 1.00
      DIAMOND_ORE: 5.00
      DEEPSLATE_DIAMOND_ORE: 5.00
  lumberjack:
    display: Lumberjack
    xp-per-action: 1.0
    break:
      OAK_LOG: 0.25
      BIRCH_LOG: 0.25
      SPRUCE_LOG: 0.25
      JUNGLE_LOG: 0.25
      ACACIA_LOG: 0.25
      DARK_OAK_LOG: 0.25
      CHERRY_LOG: 0.25
      MANGROVE_LOG: 0.25
