# Shared kit definitions — copy this same file to every backend that runs /kit
# (Hub/lobby + survival). Cooldowns + store grants live in MariaDB network-wide.
#
# Access nodes: yapdata.kit.<id>  ·  VIP starter pack grants yapdata.kit.*
# Store (Tebex on Hub): see docs/ops/TEBEX.md and examples/tebex/

kits:
  starter:
    delay-seconds: 86400
    items:
      - material: BREAD
        amount: 16
      - material: WOODEN_SWORD
        amount: 1

  # Unlocked by quest t1_first_steps or store:
  #   yapperm user {username} permission set yapdata.kit.adventurer true
  adventurer:
    delay-seconds: 43200
    items:
      - material: BREAD
        amount: 16
      - material: STONE_SWORD
        amount: 1
      - material: STONE_PICKAXE
        amount: 1
      - material: TORCH
        amount: 32
      - material: LEATHER_CHESTPLATE
        amount: 1

  # Donor / VIP loadout (also covered by yapdata.kit.* on vip rank)
  vip:
    delay-seconds: 43200
    items:
      - material: COOKED_BEEF
        amount: 32
      - material: IRON_SWORD
        amount: 1
      - material: IRON_PICKAXE
        amount: 1
      - material: IRON_AXE
        amount: 1
      - material: IRON_HELMET
        amount: 1
      - material: IRON_CHESTPLATE
        amount: 1
      - material: IRON_LEGGINGS
        amount: 1
      - material: IRON_BOOTS
        amount: 1
      - material: GOLDEN_APPLE
        amount: 4
      - material: TORCH
        amount: 64
