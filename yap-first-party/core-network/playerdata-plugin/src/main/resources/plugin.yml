name: YaPPlayerData
version: '1.0.0.0'
main: com.yapcore.playerdata.PlayerDataPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Cross-server sync, offline /login, session lock, schema — data plane for YaPcore
website: https://github.com/yaplabs
softdepend: [Vault, PlaceholderAPI, YaPDB, YaPBedrockUI]
commands:
  register:
    description: Register an offline password
    usage: /register <password> <password>
    aliases: [reg]
  login:
    description: Log in with your offline password
    usage: /login <password>
    aliases: [l]
  changepassword:
    description: Change your password
    usage: /changepassword <old> <new>
    aliases: [changepass, cp]
  logout:
    description: Log out (must /login again)
    usage: /logout
  unregister:
    description: Admin — delete a password account
    usage: /unregister <player>
    permission: yapdata.admin
  yapdata:
    description: Admin reload / status / force-save
    usage: /yapdata <reload|status|save>
    permission: yapdata.admin
permissions:
  yapdata.admin:
    description: Reload, status, force-save, manage shops/auctions/claims
    default: op
  yapdata.menu:
    description: Open /menu hub GUI
    default: true
  yapdata.balance:
    description: View your own balance
    default: true
  yapdata.balance.others:
    description: View other players' balances
    default: op
  yapdata.pay:
    description: Pay other players
    default: true
  yapdata.eco:
    description: Staff /eco give take set reset
    default: op
  yapdata.home:
    description: Set / use / delete homes
    default: true
  yapdata.warp:
    description: Use warps
    default: true
  yapdata.warp.admin:
    description: Create/delete warps
    default: op
  yapdata.kit:
    description: Open kits GUI / use /kit
    default: true
  yapdata.kit.starter:
    description: Claim the starter kit
    default: true
  yapdata.kit.adventurer:
    description: Claim the adventurer kit
    default: false
  yapdata.kit.vip:
    description: Claim the VIP kit
    default: false
  yapdata.kit.*:
    description: Access all kits
    default: op
  yapdata.kit.give:
    description: Admin / console kit give and grant (store)
    default: op
  yapdata.kit.create:
    description: /createkit /delkit and kit signs
    default: op
  yapdata.kit.reset:
    description: /kitreset cooldown and uses
    default: op
  yapdata.mail:
    description: Read / send / clear mail
    default: true
  yapdata.shop:
    description: Create shops and buy from chest shops
    default: true
  yapdata.jobs:
    description: Open jobs GUI / list jobs
    default: true
  yapdata.job.miner:
    description: Join the miner job
    default: true
  yapdata.job.lumberjack:
    description: Join the lumberjack job
    default: true
  yapdata.job.*:
    description: Join any job
    default: op
  yapdata.ah:
    description: Use the auction house
    default: true
  yapdata.claim:
    description: Use land claims
    default: true
  yapdata.claims.admin:
    description: Bypass claim protection
    default: op
  yapdata.claims.wilderness:
    description: Build in wilderness when require-claim-to-build is true
    default: false
  yapdata.bag:
    description: Open /bag extra storage
    default: true
  yapdata.bag.see:
    description: Open another player's bag
    default: op
  yapdata.bag.pages.5:
    description: At least 5 bag pages (VIP)
    default: false
  yapdata.bag.pages.7:
    description: At least 7 bag pages (staff)
    default: false
  yapdata.bag.pages.*:
    description: All configured bag pages
    default: op
