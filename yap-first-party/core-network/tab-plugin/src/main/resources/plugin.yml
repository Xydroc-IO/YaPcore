name: YaPTab
version: '1.0.0.0'
main: com.yapcore.tab.TabPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: TAB list, header/footer, sidebar, and nametag prefixes (Folia-safe)
softdepend: [YaPPerms, PlaceholderAPI, YaPEssentials, Vault]
commands:
  yaptab:
    description: Tab admin
    usage: /yaptab reload|refresh
    permission: yaptab.admin
permissions:
  yaptab.admin:
    default: op
