# Product default — CORE+NETWORK. Leave enabled: true unless this backend has no pads.
# This Folia backend's Link servers.* id (lobby / survival / …)
server-id: lobby
enabled: true

defaults:
  cooldown-seconds: 3
  # Extra permission beyond yapportals.use (blank = none)
  permission: ""
  # Dye color for particle swirl (purple, lime, red, cyan, …)
  color: purple

messages:
  transferring: "§7Sending you to §f{server}§7…"
  denied: "§cYou cannot use this portal."
  cooldown: "§cWait §f{seconds}s §cbefore using another portal."
  already-here: "§7You are already on §f{server}§7."
  no-proxy: "§cTransfer failed — join through YaP Link (proxy)."

connect:
  # Legacy channel id — YaP Link server-selector accepts BungeeCord + bungeecord:main
  channel: BungeeCord

# Player-built vertical End doors (4×5 obsidian + Ender Eye → world_the_end).
# Claim flag nether-portal / portal gates use (default private).
# Dungeon base portals use crying obsidian — no frame clash with End doors.
end-doors:
  enabled: true
  frame: OBSIDIAN
  interior: NETHER_PORTAL
  activate-item: ENDER_EYE
  width: 4
  height: 5
  end-world: world_the_end
  cooldown-seconds: 3
