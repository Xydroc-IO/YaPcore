name: YaPNpcs
version: '1.0.0.0'
main: com.yapcore.npcs.NpcsPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Quest NPCs with dialogue and objective tracking (Folia-safe)
website: https://github.com/yaplabs
softdepend: [YaPDB, YaPPlayerdata]
commands:
  npc:
    description: Quest NPC admin
    usage: /npc create <id> [name]|create <id> at <world> <x> <y> <z> [yaw] [name]|remove <id>|list [json]|setquest|setdialogue|respawn|reload|info
    permission: yapnpcs.admin
  quests:
    description: View quest progress
    usage: /quests list|progress [questId]
    permission: yapnpcs.quests
permissions:
  yapnpcs.admin:
    default: op
  yapnpcs.quests:
    default: true
