name: YaPNpcs
version: '0.0.0.1'
main: com.yapcore.npcs.NpcsPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Quest NPCs, dialogue, hub actions (shop/warp/spawn/command) — Folia-safe
website: https://github.com/yaplabs
softdepend: [YaPDB, YaPPlayerData, YaPSkills, YaPPortals, YaPHolo, YaPRegions]
commands:
  npc:
    description: Quest NPC admin
    usage: /npc create|remove|list|info|move|shop|setname|setwarp|setspawn|setserver|setcommand|setdialogue|setquest|respawn|reload
    permission: yapnpcs.admin
  quests:
    description: View quest progress
    usage: /quests list|progress [questId]
    permission: yapnpcs.quests
permissions:
  yapnpcs.admin:
    default: op
  yapnpcs.quests:
    default: true
    description: View /quests list and progress
  yapnpcs.quest:
    default: true
    description: Alias of yapnpcs.quests (docs)
    children:
      yapnpcs.quests: true
