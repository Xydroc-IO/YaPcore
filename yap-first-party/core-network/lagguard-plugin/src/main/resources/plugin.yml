name: YaPLagGuard
version: '1.0.0.0'
main: com.yapcore.lagguard.LagGuardPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Per-chunk lag-machine governor (entities, TNT, hoppers, redstone)
website: https://github.com/yaplabs
softdepend: [YaPRegions]
commands:
  yaplagguard:
    description: LagGuard admin
    usage: /yaplagguard status|reload|top [n]
    permission: yaplagguard.admin
    aliases: [lagguard, ylg]
permissions:
  yaplagguard.admin:
    default: op
  yaplagguard.bypass:
    default: op
