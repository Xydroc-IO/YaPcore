name: YaPBedrockBlocks
version: '1.0.0.0'
main: com.yapcore.bedrockblocks.BedrockBlocksPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Folia placement for Bedrock catalog port blocks (barrier+display / native light / frames)
website: https://github.com/yaplabs
softdepend: [FoliaBridge]
commands:
  yapblock:
    description: Give, list, or place Bedrock catalog port blocks
    usage: /yapblock <give|list|set> …
    aliases: [yapblocks, portblock]
    permission: yap.bedrockblocks.use
permissions:
  yap.bedrockblocks.use:
    description: Use /yapblock give|list|set
    default: op
  yap.bedrockblocks.admin:
    description: Admin port-block tools
    default: op
