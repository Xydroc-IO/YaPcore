name: YaPDiscord
version: '1.0.0.0'
main: com.yapcore.discord.DiscordPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Discord webhook bridge for moderation logs and optional chat relay
softdepend: [YaPModeration, YaPChat]
commands:
  yapdiscord:
    description: Discord bridge admin
    usage: /yapdiscord reload|test [moderation|chat]|say <message>
    permission: yapdiscord.admin
permissions:
  yapdiscord.admin:
    default: op
