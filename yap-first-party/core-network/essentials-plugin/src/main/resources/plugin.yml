name: YaPEssentials
version: '1.0.0.0'
main: com.yapcore.essentials.EssentialsPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Essentials-class QoL — spawn/TPA/fly plus bag/homes/kits/economy/shops (data via YaPPlayerData)
website: https://github.com/yaplabs
softdepend: [YaPPerms, YaPPlayerData, YaPDisasters]
loadbefore: []
commands:
  spawn:
    description: Teleport to spawn
    usage: /spawn
    permission: yapessentials.spawn
  setspawn:
    description: Set the server spawn
    usage: /setspawn
    permission: yapessentials.setspawn
  back:
    description: Return to previous location
    usage: /back
    permission: yapessentials.back
  tpa:
    description: Request teleport to a player
    usage: /tpa <player>
    permission: yapessentials.tpa
  tpahere:
    description: Request a player teleport to you
    usage: /tpahere <player>
    permission: yapessentials.tpa
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept
    aliases: [tpyes]
    permission: yapessentials.tpa
  tpdeny:
    description: Deny a teleport request
    usage: /tpdeny
    aliases: [tpno]
    permission: yapessentials.tpa
  gm:
    description: Change game mode (0/1/2/3 or s/c/a/sp)
    usage: /gm <0|1|2|3|s|c|a|sp> [player]
    aliases: [egm]
    permission: yapessentials.gamemode
  gms:
    description: Survival mode
    usage: /gms [player]
    permission: yapessentials.gamemode
  gmc:
    description: Creative mode
    usage: /gmc [player]
    permission: yapessentials.gamemode
  gma:
    description: Adventure mode
    usage: /gma [player]
    permission: yapessentials.gamemode
  gmsp:
    description: Spectator mode
    usage: /gmsp [player]
    permission: yapessentials.gamemode
  i:
    description: Give an item to yourself or another player
    usage: /i <item> [amount] [player]
    aliases: [item]
    permission: yapessentials.item
  fly:
    description: Toggle flight
    usage: /fly [player]
    permission: yapessentials.fly
  god:
    description: Toggle god mode
    usage: /god [player]
    permission: yapessentials.god
  speed:
    description: Set walk/fly speed
    usage: /speed <0-10> [fly|walk]
    permission: yapessentials.speed
  heal:
    description: Heal yourself or another player
    usage: /heal [player]
    permission: yapessentials.heal
  feed:
    description: Feed yourself or another player
    usage: /feed [player]
    permission: yapessentials.feed
  repair:
    description: Repair held items
    usage: /repair [hand|all]
    permission: yapessentials.repair
  clear:
    description: Clear inventory
    usage: /clear [player]
    permission: yapessentials.clear
  vanish:
    description: Toggle vanish
    usage: /vanish [player]
    aliases: [v]
    permission: yapessentials.vanish
  invsee:
    description: Open another player's inventory
    usage: /invsee <player>
    permission: yapessentials.invsee
  echest:
    description: Open another player's ender chest
    usage: /echest <player>
    aliases: [enderchest, ec]
    permission: yapessentials.echest
  nick:
    description: Change display name
    usage: /nick <name|off> [player]
    permission: yapessentials.nick
  afk:
    description: Toggle AFK status
    usage: /afk
    permission: yapessentials.afk
  list:
    description: List online players
    usage: /list
    aliases: [online, who]
    permission: yapessentials.list
  ptime:
    description: Set personal client time
    usage: /ptime <time|reset> [player]
    permission: yapessentials.ptime
  pweather:
    description: Set personal client weather
    usage: /pweather <weather|reset> [player]
    permission: yapessentials.pweather
  broadcast:
    description: Broadcast a message
    usage: /broadcast <message>
    aliases: [bc, say]
    permission: yapessentials.broadcast
  rules:
    description: Show server rules
    usage: /rules
    permission: yapessentials.rules
  motd:
    description: Show message of the day
    usage: /motd
    permission: yapessentials.motd
  weather:
    description: Set world weather (or YaPDisasters GUI when installed)
    usage: /weather <clear|rain|thunder|lock|unlock|gui> [seconds] [world]
    permission: yapessentials.weather
  near:
    description: List nearby players
    usage: /near [radius]
    aliases: [nearby]
    permission: yapessentials.near
  workbench:
    description: Open a crafting table
    usage: /workbench
    aliases: [craft, wb]
    permission: yapessentials.workbench
  disposal:
    description: Open a disposable trash inventory
    usage: /disposal
    aliases: [trash, dispose]
    permission: yapessentials.disposal
  suicide:
    description: Kill yourself
    usage: /suicide
    aliases: [kill]
    permission: yapessentials.suicide
  hat:
    description: Wear item in hand as hat
    usage: /hat
    permission: yapessentials.hat
  tp:
    description: Teleport to a player
    usage: /tp <player> [target]
    permission: yapessentials.teleport
  tphere:
    description: Teleport a player to you
    usage: /tphere <player>
    aliases: [s]
    permission: yapessentials.teleport
  freeze:
    description: Freeze or unfreeze a player
    usage: /freeze <player>
    permission: yapessentials.staff.freeze
  check:
    description: Inspect a player
    usage: /check <player>
    permission: yapessentials.staff.check
  yapess:
    description: Essentials admin
    usage: /yapess reload
    permission: yapessentials.admin
  menu:
    description: Open YaP hub GUI
    usage: /menu
    aliases: [yapmenu, playermenu]
    permission: yapdata.menu
  bal:
    description: Show your balance (or another player's)
    usage: /bal [player]
    aliases: [balance, money]
    permission: yapdata.balance
  pay:
    description: Pay another player
    usage: /pay <player> <amount>
    permission: yapdata.pay
  eco:
    description: Staff economy — give, take, set, or reset a balance
    usage: /eco <give|take|set|reset> <player> [amount]
    aliases: [economy]
    permission: yapdata.eco
  sethome:
    description: Set a home
    usage: /sethome [name]
    permission: yapdata.home
  home:
    description: Teleport to a home
    usage: /home [name]
    permission: yapdata.home
  delhome:
    description: Delete a home
    usage: /delhome <name>
    permission: yapdata.home
  homes:
    description: Homes GUI
    usage: /homes
    permission: yapdata.home
  setwarp:
    description: Set a server warp
    usage: /setwarp <name>
    permission: yapdata.warp.admin
  delwarp:
    description: Delete a warp
    usage: /delwarp <name>
    permission: yapdata.warp.admin
  warp:
    description: Teleport to a warp
    usage: /warp <name>
    permission: yapdata.warp
  warps:
    description: Warps GUI
    usage: /warps
    permission: yapdata.warp
  kit:
    description: Claim a kit, or admin give/grant/create/reset
    usage: /kit [name|give|grant|list|create|delete|show|reset]
    permission: yapdata.kit
  kits:
    description: Kits GUI
    usage: /kits
    permission: yapdata.kit
  createkit:
    description: Save current inventory as a kit
    usage: /createkit <name> [delaySeconds]
    permission: yapdata.kit.create
    aliases: [kitcreate]
  delkit:
    description: Delete a kit from kits.yml
    usage: /delkit <name>
    permission: yapdata.kit.create
  showkit:
    description: Preview a kit
    usage: /showkit <name>
    permission: yapdata.kit
    aliases: [previewkit]
  kitreset:
    description: Reset kit cooldown / uses
    usage: /kitreset <player> [kit|all]
    permission: yapdata.kit.reset
  kitresetcooldown:
    description: Alias of /kitreset
    usage: /kitresetcooldown <player> [kit|all]
    permission: yapdata.kit.reset
  mail:
    description: Mail GUI / send
    usage: /mail [read|clear|send <player> <msg>]
    permission: yapdata.mail
  shop:
    description: Chest shops
    usage: /shop <create <price>|remove|info>
    permission: yapdata.shop
  jobs:
    description: Jobs GUI / join / leave
    usage: /jobs [join|leave|list] [name]
    aliases: [job]
    permission: yapdata.jobs
  ah:
    description: Auction house GUI
    usage: /ah [list|sell <price>|buy <id>|cancel <id>]
    aliases: [auction, auctions]
    permission: yapdata.ah
  claim:
    description: Land claims — subdivide, tax, trust
    usage: /claim [tool|subdivide|tax|paytax|here|abandon|trust|untrust]
    aliases: [claims]
    permission: yapdata.claim
  bag:
    description: Open extra bag pages
    usage: /bag [page] | /bag see <player> [page]
    permission: yapdata.bag
    aliases: [backpack, bp]
permissions:
  yapessentials.spawn:
    default: true
  yapessentials.setspawn:
    default: op
  yapessentials.back:
    default: true
  yapessentials.tpa:
    default: true
  yapessentials.gamemode:
    default: op
    description: Change game mode with /gm /gms /gmc /gma /gmsp
  yapessentials.item:
    default: op
    description: Give items with /i
  yapessentials.fly:
    default: op
  yapessentials.god:
    default: op
  yapessentials.speed:
    default: op
  yapessentials.heal:
    default: op
  yapessentials.feed:
    default: op
  yapessentials.repair:
    default: op
  yapessentials.clear:
    default: op
  yapessentials.vanish:
    default: op
  yapessentials.invsee:
    default: op
  yapessentials.echest:
    default: op
  yapessentials.nick:
    default: op
  yapessentials.nick.others:
    default: op
  yapessentials.afk:
    default: true
  yapessentials.list:
    default: true
  yapessentials.ptime:
    default: op
  yapessentials.pweather:
    default: op
  yapessentials.weather:
    description: /weather GUI and extended weather controls
    default: op
  yapessentials.near:
    default: true
  yapessentials.workbench:
    default: true
  yapessentials.disposal:
    default: true
  yapessentials.broadcast:
    default: op
  yapessentials.rules:
    default: true
  yapessentials.motd:
    default: true
  yapessentials.suicide:
    default: true
  yapessentials.hat:
    default: op
  yapessentials.teleport:
    default: op
  yapessentials.staff.freeze:
    default: op
  yapessentials.staff.check:
    default: op
  yapessentials.admin:
    default: op
