name: YaPTebex
version: '0.0.0.1'
main: com.yapcore.tebex.TebexWebhookPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Localhost Tebex webhook receiver — package ID to console command delivery
softdepend: [YaPPerms, YaPPlayerData]
commands:
  yaptebex:
    description: Tebex webhook admin
    usage: /yaptebex reload|status
    permission: yaptebex.admin
permissions:
  yaptebex.admin:
    description: Reload and status for Tebex webhook inbound
    default: op
