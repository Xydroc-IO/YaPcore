name: YaPFactions
version: 1.0.0.0
main: com.yapcore.factions.FactionsPlugin
api-version: '1.21'
folia-supported: true
description: Factions/guilds overlay on playerdata claims — power, relations, warps, bank
authors: [YapLabs]
depend: [YaPDB]
softdepend: [YaPPlayerData, PlaceholderAPI, YaPDiscord, YaPPerms, YaPTab]
commands:
  f:
    description: Faction commands
    usage: /f help
    aliases: [faction, factions]
  guild:
    description: Guild alias for /f
    usage: /guild help
    aliases: [g, clans, clan]
  yapfactions:
    description: YaPFactions admin
    usage: /yapfactions reload|snapshot
    aliases: [yapf]
permissions:
  yapfactions.use:
    description: Basic faction commands
    default: true
  yapfactions.admin:
    description: /yapfactions admin commands
    default: op
  yapfactions.create:
    description: Create a faction
    default: true
  yapfactions.officer:
    description: Officer actions (invite, claim, bank withdraw)
    default: true
  yapfactions.leader:
    description: Leader actions (disband, transfer, join mode)
    default: true
