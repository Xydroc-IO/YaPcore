name: YaPRegions
version: '1.0.0.0'
main: com.yapcore.regions.RegionsPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Admin cuboid regions with WorldGuard-class flags (Folia-safe)
website: https://github.com/yaplabs
softdepend: [YaPWorld, YaPDB]
commands:
  region:
    description: Admin region management
    usage: /region define <name>|flag set <name> <flag> <allow|deny>|list
    permission: yapregions.admin
    aliases: [rg]
permissions:
  yapregions.admin:
    default: op
