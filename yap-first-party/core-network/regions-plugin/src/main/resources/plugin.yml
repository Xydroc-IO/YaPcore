name: YaPRegions
version: '0.0.0.2'
main: com.yapcore.regions.RegionsPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Admin cuboid and polygon regions with WorldGuard-class flags (Folia-safe)
website: https://github.com/yaplabs
softdepend: [YaPWorld, YaPDB]
commands:
  region:
    description: Admin region management
    usage: /region define|flag|gamemode|worldborder|priority|list|info|reload
    permission: yapregions.admin
    aliases: [rg]
permissions:
  yapregions.admin:
    default: op
