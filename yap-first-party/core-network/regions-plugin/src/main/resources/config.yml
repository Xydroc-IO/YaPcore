# YaP Regions — shipped defaults (typical SMP)
# Prefer dashboard: Plugin settings (or Gameplay tab) → Save → reload

# Fleet stamps yap-server-id.txt next to the server jar. That file wins over this value.
server-id: default

# Backends listed here deny hunger + all player damage everywhere (lobby / hub).
# Empty list = off. Omit the key to keep the product default (lobby).
safe-servers:
  - lobby
  - hub

# Auto cuboid around /setspawn (and first-boot world spawn) with the built-in spawn template.
spawn-pad:
  enabled: true
  region-name: spawn
  radius: 64
  height: 96

# When set (survival|creative|adventure|spectator), players outside any region
# that forces a gamemode are put in this mode. Blank = restore previous mode.
outside-gamemode: ""

# Enter / leave popups (title + action bar). {region} = pretty region name.
notify:
  enabled: true
  title: true
  action-bar: true
  chat: false
  fade-in-ms: 200
  stay-ms: 1800
  fade-out-ms: 400
  enter-title: "&aEntering"
  enter-subtitle: "&f{region}"
  leave-title: "&7Leaving"
  leave-subtitle: "&f{region}"
  action-bar-enter: "&a» &f{region}"
  action-bar-leave: "&7« &f{region}"
