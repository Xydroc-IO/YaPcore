# Fleet stamps yap-server-id.txt next to the server jar. That file wins over this value.
server-id: default

# When set (survival|creative|adventure|spectator), players outside any region
# that forces a gamemode are put in this mode. Blank = restore previous mode.
# Typical for survival backends: outside-gamemode: survival
outside-gamemode: ""

# Enter / leave popups (title + action bar). {region} = pretty region name.
notify:
  enabled: true
  title: true
  action-bar: true
  # Also send custom greeting/farewell to chat (off by default — title/action bar is enough)
  chat: false
  fade-in-ms: 200
  stay-ms: 1800
  fade-out-ms: 400
  enter-title: "&aEntering"
  enter-subtitle: "&f{region}"
  leave-title: "&7Leaving"
  leave-subtitle: "&f{region}"
  action-bar-enter: "&a» &f{region}"
  action-bar-leave: "&7« &f{region}"
