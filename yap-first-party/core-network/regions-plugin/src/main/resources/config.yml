server-id: default

# Enter / leave popups (title + action bar). {region} = pretty region name.
notify:
  enabled: true
  title: true
  action-bar: true
  # Also send custom greeting/farewell to chat (off by default — title/action bar is enough)
  chat: false
  fade-in-ms: 200
  stay-ms: 1800
  fade-out-ms: 400
  enter-title: "&aEntering"
  enter-subtitle: "&f{region}"
  leave-title: "&7Leaving"
  leave-subtitle: "&f{region}"
  action-bar-enter: "&a» &f{region}"
  action-bar-leave: "&7« &f{region}"
