name: YaPProtect
version: '1.0.0.0'
main: com.yapcore.protect.ProtectPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Block/entity/container audit logging and rollback (CoreProtect-class)
website: https://github.com/yaplabs
softdepend: [YaPDB, YaPModeration]
commands:
  yapprotect:
    description: Protect admin
    usage: /yapprotect status|reload|lookup|rollback|prune
    permission: yapprotect.admin
    aliases: [co, coreprotect]
permissions:
  yapprotect.admin:
    default: op
  yapprotect.lookup:
    default: op
  yapprotect.rollback:
    default: op
