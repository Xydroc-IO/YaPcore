name: YaPPerms
version: '1.0.0.0'
main: com.yapcore.perms.PermsPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: Native first-party permissions — groups, inheritance, tracks, prefixes
website: https://github.com/yaplabs
load: STARTUP
depend: [YaPDB]
softdepend: [PlaceholderAPI, Vault]
commands:
  yapperm:
    description: Manage YaP permissions
    usage: /yapperm [gui|user|group|track|check|export|import|dump|editor-apply|reload|applypack] ...
    permission: yapperm.user
    aliases: [yperms, perms, ranks, lp]
  promote:
    description: Promote a player on the default track
    usage: /promote <player> [track]
    permission: yapperm.promote
  demote:
    description: Demote a player on the default track
    usage: /demote <player> [track]
    permission: yapperm.demote
permissions:
  yapperm.admin:
    description: Full permission management
    default: op
  yapperm.promote:
    description: Promote players on tracks
    default: op
  yapperm.demote:
    description: Demote players on tracks
    default: op
  yapperm.user:
    description: View own permission info and open ranks GUI
    default: true
  yap.bypass:
    description: Bypass all YaP land/chat/AC/skills rules (admins and OPs)
    default: op
  yapskills.bypass:
    description: Skip skill XP gains
    default: op
  yap.bypass.mmo:
    description: Legacy alias of yapskills.bypass
    default: op
    children:
      yapskills.bypass: true
