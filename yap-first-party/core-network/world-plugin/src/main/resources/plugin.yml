name: YaPWorld
version: '1.0.0.0'
main: com.yapcore.world.WorldPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: World management, region selection, and schematic tools (Folia-safe)
website: https://github.com/yaplabs
softdepend: [YaPPerms, YaPPregen]
commands:
  yapworld:
    description: World admin
    usage: /yapworld load|unload|tp|wand|pos1|pos2|schem|brush|undo|redo|pregen|status|reload
    permission: yapworld.admin
    aliases: [mv, worldedit]
permissions:
  yapworld.admin:
    default: op
  yapworld.load:
    default: op
  yapworld.unload:
    default: op
  yapworld.teleport:
    default: op
  yapworld.selection:
    default: op
  yapworld.schematic:
    default: op
  yapworld.brush:
    default: op
  yapworld.pregen:
    default: op
