name: YaPWorld
version: '1.0.0.0'
main: com.yapcore.world.WorldPlugin
api-version: '1.21'
folia-supported: true
author: YapLabs
description: World management, region selection, and schematic tools (Folia-safe)
website: https://github.com/yaplabs
softdepend: [YaPPerms, YaPPregen]
commands:
  yapworld:
    description: World edit + world admin (Folia-safe WorldEdit-class)
    usage: /yapworld help|gui|tool|set|copy|paste|…  (also //set //copy …)
    # Per-subcommand permissions — do not require admin for basic editing
    aliases: [mv, worldedit, we]
permissions:
  yapworld.admin:
    default: op
  yapworld.load:
    default: op
  yapworld.unload:
    default: op
  yapworld.teleport:
    default: op
  yapworld.selection:
    default: op
    description: Wand, pos1/pos2, in-game GUI, fill/walls/shell
  yapworld.editor:
    default: op
    description: Open the browser world edit studio (/yapworld editor)
  yapworld.schematic:
    default: op
  yapworld.cui:
    default: op
    description: Receive WorldEditCUI selection outlines
  yapworld.brush:
    default: op
  yapworld.pregen:
    default: op
