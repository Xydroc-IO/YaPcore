# YaP Link — multi-backend example (copy to link.properties)
# See docs/network/YAP_LINK.md

bind=0.0.0.0:25565
motd=YaPcore · Folia Game · Yap Edge
max-players=300
online-mode=false
player-info-forwarding-mode=modern
forwarding-secret-file=forwarding.secret

servers.lobby=127.0.0.1:25566
# servers.survival=127.0.0.1:25567
try=lobby
# forced-host.lobby.yaplabs.us=lobby

ping-passthrough=true
aggregate-player-count=true
chat-relay-enabled=true
chat-relay-format=[{server}] {name}: {message}

plugins-enabled=true
# First run via ./scripts/start-yap-link.sh also seeds link-data/plugins/*.jar
# First-party Bedrock: Link-native session host (product default).
# bedrock-mode=native | forwarder | geyser-backup (set via dashboard before start)
bedrock-mode=native
bedrock-enabled=true
floodgate-key-file=floodgate-key.pem
# servers.lobby.bedrock=127.0.0.1:19132

enable-server-command=true
public-host=127.0.0.1
public-port=0

# Edge rate limits — docs/network/NETWORKING.md
connect-rate-limit-enabled=true
connect-rate-per-ip=20
connect-rate-window-ms=10000
handshake-rate-limit-enabled=true
handshake-rate-per-ip=40
handshake-rate-window-ms=10000
login-rate-limit-enabled=true
login-rate-per-ip=10
login-rate-window-ms=10000
metrics-http-enabled=true
metrics-http-bind=127.0.0.1
metrics-http-port=9091

# Concurrent sessions per IP (Phase 4 lite)
max-concurrent-per-ip-enabled=true
max-concurrent-per-ip=8
rate-limit-exempt-loopback=true
# Shared-port UDP :25565 + phone default :19132 → Link-native Bedrock
bedrock-bind=0.0.0.0:25565,0.0.0.0:19132
bedrock-also-19132=true
bedrock-shared-port=true
bedrock-backend=127.0.0.1:25566
geyser-enabled=false
geyser-home=geyser
geyser-jar=Geyser-Standalone.jar
geyser-remote-host=127.0.0.1
geyser-remote-port=25565
geyser-bedrock-bind=0.0.0.0:19132
