# YaPcore — copy to config/server.properties (gitignored) and edit
#
# Sensible defaults for local/LAN. See docs/start/QUICK_START.md for production profile.

server-name=YaPcore
motd=YaPcore · Folia Game · Yap Edge
port=25566
bind-host=0.0.0.0
max-players=300
ram-mb=2048
ram-min-mb=512
view-distance=32

# Local/LAN — set online-mode=true before going public
online-mode=false
auto-op=false
ops=
allow-localhost=true
internet-exposed=false

# Public join (leave blank for LAN; set when internet-exposed=true)
server-domain=
public-host=
public-port=0
public-bedrock-port=19132
public-pack-port=0

# Editions & crossplay — Link-native Bedrock (product default); chassis UDP off
# bedrock-mode=native | forwarder | geyser-backup (dashboard Link tab before start)
java-enabled=true
bedrock-mode=native
bedrock-enabled=false
shared-listen-port=false
crossplay-enabled=true
backwards-compatible=true

# Bedrock-feel parity (Phase 0 catalogs/toolchain). Keep false until presence/blocks ship.
parity.bedrock-feel=false
parity.bedrock-band=band_26_50

# Game authority (product default)
game-authority=folia
folia-embed=true
folia-dir=folia-kernel
# Multi-server fleet (off by default — Enable fleet migrates lobby → fleet/instances/lobby)
fleet-enabled=false
fleet-primary-id=lobby
folia-port=25567
folia-version=26.2
# Legacy BukkitScheduler → Folia region schedulers (yap-sched-agent)
folia-sched-compat=true
folia-sched-compat-warn=true
# Cross-region teleport two-phase commit (requires patched yap-folia)
folia-teleport-transactions=true
# Phase 3–6 perf knobs (YaP-Folia patches 0010–0033)
# Smart Mob AI budget + AI time-slice + subregion partition + corridor carve + aligned microticks = **ship cite profile**.
# see docs/folia/YAP_FOLIA_PATCHES.md
folia-async-chunk-save=true
folia-entity-tick-budget=800
folia-budget-mspt-threshold=18
folia-entity-tick-max-deferred=40
folia-hopper-tick-budget=64
folia-scoreboard-swmr=true
folia-microtick-budget-ms=12
# Phase 6 — aligned micro/sub-ticks across regions (patches 0026–0030). Ship-on.
# Per-world YapMicroPhase waves (same 20 TPS game time).
folia-aligned-microticks=true
folia-micro-phases=4
folia-tick-wave-max-wait-ms=2
# Phase 7 — internal physics sub-steps (patch 0031). Plugin tick stays 20 TPS.
folia-physics-substeps=true
folia-physics-substep-count=4
folia-physics-substep-min-move=0.02
folia-steal-threshold-ms=3
folia-task-slice-ms=2
folia-grid-exponent=3
folia-region-metrics=true
folia-subregion-partition=true
folia-subregion-shards=2
folia-subregion-mspt-threshold=20
folia-subregion-mspt-clear=16
folia-subregion-min-sections=4
folia-subregion-min-entities=32
folia-subregion-coalesce-mspt=8
folia-subregion-coalesce-ticks=100
folia-subregion-coalesce-quiet-ticks=200
folia-subregion-coalesce-min-wall-ms=30000
folia-subregion-carve=true
folia-regionizer-cut=true
folia-ticket-hygiene=true
folia-portal-couple=true
folia-subregion-partition-delay-ticks=600
# folia-jar-source=fetch|build|path|auto
# Default: build (YaP-Folia) after ./scripts/build-yap-folia.sh — see docs/folia/YAP_FOLIA_PATCHES.md
# Stock Fill fallback: folia-jar-source=fetch + ./scripts/fetch-folia.sh
folia-jar-source=build
# folia-jar-path=
# folia-jar-url=

# Resource pack — clients download from GitHub Releases (always latest tag asset)
resource-pack-enabled=true
resource-pack-file=yapcore-default.zip
resource-pack-files=yapcore-default.zip
resource-pack-bedrock-file=yapcore-default.mcpack
resource-pack-http-port=8081
resource-pack-public-host=
# {file} → active zip name. Pin the 0.0.0.1 prerelease — /releases/latest ignores prereleases.
resource-pack-url=https://github.com/Xydroc-IO/YaPcore/releases/download/0.0.0.1/{file}
resource-pack-forced=false
resource-pack-prompt=This server offers a resource pack. Click Yes to download, or No to play without it.

# Web dashboard (token auto-generated on first boot if empty)
web-dashboard-enabled=true
web-dashboard-port=8080
web-dashboard-bind=127.0.0.1
web-dashboard-localhost-only=true
web-dashboard-token=

# Native ranks — auto-apply starter pack ~8s after first boot
yap-ranks-auto-apply=true

# GUI
gui-enabled=true

# nginx (optional public edge — see docs/network/NETWORKING.md)
nginx-domain=
nginx-public-port=25565
nginx-pack-port=80
srv-enabled=true
srv-priority=0
srv-weight=5

# Proxy — YaP Link modern forwarding (skins). Join :25565; set false only for direct :25566 without Link.
velocity-enabled=true
velocity-secret-file=forwarding.secret
velocity-online-mode=false
velocity-bind-localhost=true

# JVM tuning
jvm-gc=zgc
jvm-numa=true
jvm-heap-pin=true
