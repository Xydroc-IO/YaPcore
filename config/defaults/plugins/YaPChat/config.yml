# Hide "Chat messages cannot be verified" on offline / Link / Via joins.
unsigned-system-chat: true

# Default public channel
default-channel: global

# Channels — optional permission gates speak + hear
channels:
  global:
    format: "{prefix}{namecolor}{player}{suffix}&7: {chatcolor}{message}"
    radius: -1
  local:
    format: "&8[&aLocal&8] {prefix}{namecolor}{player}{suffix}&7: {chatcolor}{message}"
    radius: 100
  trade:
    format: "&8[&6Trade&8] {prefix}{namecolor}{player}{suffix}&7: {chatcolor}{message}"
    radius: -1
  staff:
    format: "&8[&bStaff&8] {prefix}{namecolor}{player}{suffix}&7: {chatcolor}{message}"
    radius: -1
    permission: yapchat.staff
  admin:
    format: "&8[&cAdmin&8] {prefix}{namecolor}{player}{suffix}&7: {chatcolor}{message}"
    radius: -1
    permission: yapchat.admin

# Prefix local chat with ! (one-shot without switching channel)
local-prefix: "!"

# Slow mode (seconds between messages; 0 = off)
slow-mode-seconds: 0

# Basic word filter (case-insensitive substring match)
filter:
  enabled: true
  mode: replace
  block-on-match: false
  words:
    - fuck
    - shit
  replacement: "***"

messages:
  muted: "&cYou are muted. &7({reason})"
  no-permission: "&cNo permission."
  pm-sent: "&7[&dYou → {target}&7] &f{message}"
  pm-received: "&7[&d{sender} → You&7] &f{message}"
  staff-format: "&8[&bStaff&8] &f{player}&7: &f{message}"
  admin-format: "&8[&cAdmin&8] &f{player}&7: &f{message}"
  socialspy: "&8[Spy] &7{sender} → {target}: &f{message}"
  slow-mode: "&cSlow mode — wait {seconds}s."
  filtered: "&cMessage blocked by filter."

server-id: lobby

network:
  enabled: true
  relay-channels:
    - global
    - trade
    - staff
    - admin
