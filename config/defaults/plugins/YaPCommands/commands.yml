# YaP Commands — shipped defaults (typical SMP)
# Edit via dashboard Custom commands tab or this file, then reload.
# Placeholders: {player} {uuid} {display} {world} {x} {y} {z} {args} {args0} {args1} …
# permission: empty = anyone with yapcommands.use (if require-use-perm); or set yapcommands.cmd.<name>
# Replace CHANGE_ME links with your Discord invite and store URL.

require-use-perm: true

commands:
  discord:
    enabled: true
    aliases: [dc, disc]
    permission: ""
    description: Discord invite
    cooldown-seconds: 3
    hide-no-permission: true
    messages:
      - "&9Discord:&f join at &bCHANGE_ME"
    player-commands: []
    console-commands: []
    broadcast: ""
  rules:
    enabled: true
    aliases: [rule]
    permission: ""
    description: Server rules
    cooldown-seconds: 5
    hide-no-permission: true
    messages:
      - "&eRules"
      - "&7• Be respectful"
      - "&7• No cheating or griefing"
      - "&7• Follow staff instructions"
    player-commands: []
    console-commands: []
    broadcast: ""
  store:
    enabled: true
    aliases: [shop, buy]
    permission: ""
    description: Store link
    cooldown-seconds: 3
    hide-no-permission: true
    messages:
      - "&aStore:&f CHANGE_ME"
    player-commands: []
    console-commands: []
    broadcast: ""
