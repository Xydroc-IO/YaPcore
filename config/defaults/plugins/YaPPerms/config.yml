# YaPPerms — native permissions (shared MariaDB via YaPDB)
use-shared-yapdb: true

# JDBC fallback when YaPDB is absent
jdbc:
  url: jdbc:mysql://127.0.0.1:3306/yap_playerdata
  user: yap
  password: change-me

pool:
  maximum-pool-size: 8
  minimum-idle: 2
  connection-timeout-ms: 10000

# Default group for new players (must exist after applypack)
default-group: default
default-track: yap

# Apply YaP starter rank pack on first boot (default/vip/mod/admin + track yap)
apply-starter-pack-on-first-boot: true

# Chat/tab meta uses legacy § codes; Adventure consumers may translate
groups:
  default:
    weight: 0
    prefix: "&7"
    suffix: ""
    parents: []
  vip:
    weight: 10
    prefix: "&a[VIP] "
    suffix: " &a✦"
    parents: [default]
  mod:
    weight: 50
    prefix: "&9[Mod] "
    suffix: ""
    parents: [vip]
  admin:
    weight: 100
    prefix: "&c[Admin] "
    suffix: ""
    parents: [mod]

tracks:
  yap: [default, vip, mod, admin]

# Starter permission grants (merged into group rows on applypack)
starter-grants:
