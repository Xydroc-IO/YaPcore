# YaPPerms — native permissions (shared MariaDB via YaPDB)
use-shared-yapdb: true

# JDBC fallback when YaPDB is absent
jdbc:
  url: jdbc:mysql://127.0.0.1:3306/yap_playerdata
  user: yap
  password: change-me

pool:
  maximum-pool-size: 8
  minimum-idle: 2
  connection-timeout-ms: 10000

# Default group for new players (must exist after applypack)
default-group: default
default-track: yap

# Server context for world/server-scoped nodes (blank = only global + matching world)
server-context: ""

# Apply YaP starter rank pack on first boot (default/vip/staff/admin/owner + track yap)
apply-starter-pack-on-first-boot: true

# Chat/tab meta uses legacy § codes; Adventure consumers may translate
groups:
  default:
    weight: 0
    prefix: "&7"
    suffix: ""
    name-color: "&7"
    chat-color: "&f"
    parents: []
  vip:
    weight: 10
    prefix: "&a[VIP] "
    suffix: " &a✦"
    name-color: "&a"
    chat-color: "&f"
    parents: [default]
  # Legacy alias — same ladder step as staff; prefer assigning staff going forward
  mod:
    weight: 45
    prefix: "&9[Mod] "
    suffix: ""
    name-color: "&9"
    chat-color: "&f"
    parents: [vip]
  staff:
    weight: 50
    prefix: "&b[Staff] "
    suffix: ""
    name-color: "&b"
    chat-color: "&f"
    parents: [vip]
  admin:
    weight: 100
    prefix: "&c[Admin] "
    suffix: ""
    name-color: "&c"
    chat-color: "&f"
    parents: [staff]
  owner:
    weight: 200
    prefix: "&6[Owner] "
    suffix: ""
    name-color: "&6"
    chat-color: "&f"
    parents: [admin]

tracks:
  yap: [default, vip, staff, admin, owner]

