# YaP World — shipped defaults (typical SMP)
# Opt-in plugins: leave enabled: false until you want them
# Go public: see docs/start/SECRETS.md + DEFAULTS.md LAN vs public table
# Prefer dashboard: Plugin settings (or Gameplay tab) → Save → reload

worlds:
  allow-load: true
  allow-unload: true

selection:
  enabled: true
  max-volume: 2000000

schematics:
  enabled: true
  folder: schematics

brush:
  max-radius: 32

undo:
  max-sessions: 25

limits:
  max-changes: 2000000
  max-radius: 128
  parallel-chunks: 4
  parallel-chunks-large: 12
  large-paste-blocks: 50000
  auto-fast-large: true
  defer-relight-large: true
  progress-messages: true
  auto-relight: false
  # CFI-lite: schem paste via BlockBatch (parallel waves/preload/undo/progress). false = legacy 1-block/region
  schem-use-block-batch: true

cui:
  enabled: true

editor:
  enabled: true
  port: 8092
  bind: "0.0.0.0"
  # Hostname/IP players use in the browser (set to your server address)
  public-host: "127.0.0.1"
  clipboard-web: true

server-id: lobby

# Resource worlds: wipe + recreate on a timer (bases stay on main / claimed land).
# Create once with /yapworld create resource, then enable the reset schedule here.
# Pair with YaPClaims claims.deny-worlds: [resource]
resource:
  worlds:
    resource:
      name: resource
      reset-interval-hours: 24
      announce-minutes: [60, 15, 5]
      environment: NORMAL
      type: NORMAL
      generate-structures: true
      deny-claims: true
  # Same-world ore respawn outside claims (optional; off by default)
  wilderness-replenish:
    enabled: false
    delay-seconds: 300
    # Empty materials = default ore set when enabled
    materials: []
    worlds: []
    exclude-worlds: []

# Always day, no weather, no natural mobs. Unset = on when this instance is "creative".
# climate:
#   enabled: true
