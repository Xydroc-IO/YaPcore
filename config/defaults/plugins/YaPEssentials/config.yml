# YaP Essentials — shipped defaults (typical SMP)
# Opt-in plugins: leave enabled: false until you want them
# Go public: see docs/start/SECRETS.md + DEFAULTS.md LAN vs public table
# Prefer dashboard: Plugin settings (or Gameplay tab) → Save → reload

spawn:
  world: world
  x: 0.5
  y: 80.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
  # global = one spawn network-wide; server = per server-id
  scope: server
  persist-db: true
  teleport-on-join: true
  # Lobby/hub: adventure on every join. Blank on survival/creative backends.
  force-gamemode: adventure

server-id: lobby
use-shared-yapdb: true

database:
  # Fallback only when YaPDB is absent — prefer use-shared-yapdb + ./configure-db.sh
  jdbc-url: "jdbc:mysql://127.0.0.1:3306/yap_playerdata?useSSL=false&allowPublicKeyRetrieval=true"
  user: yap
  password: change-me
  pool-max: 4
  pool-min-idle: 1
  connection-timeout-ms: 10000

tpa:
  timeout-seconds: 60

afk:
  prefix: "&7[AFK] "

messages:
  rules:
    - "&6Server Rules"
    - "&71. Be respectful."
    - "&72. No cheating."
  motd:
    - "&aWelcome to the server!"
    - "&7Type &f/rules &7or &f/menu"

broadcast-format: "&6[Broadcast] &f{message}"

features:
  spawn: true
  back: true
  tpa: true
  teleport: true
  gamemode: true
  item: true
  fly: true
  god: true
  speed: true
  heal: true
  feed: true
  repair: true
  clear: true
  vanish: true
  invsee: true
  echest: true
  nick: true
  afk: true
  list: true
  ptime: true
  pweather: true
  weather: true
  broadcast: true
  rules: true
  motd: true
  suicide: true
  hat: true
  staff: true
  rtp: true

# Random / wild teleport (survival + factions). Folia-safe surface search.
rtp:
  enabled: true
  worlds:
    - world
  min-radius: 1600
  max-radius: 16000
  min-y: 40
  max-y: 200
  max-attempts: 40
  cooldown-seconds: 60
  avoid-claims: true
  center-on-spawn: true
  center-x: 0.0
  center-z: 0.0

# Death drops — false = vanilla drops for everyone.
# Players with yapessentials.keepinventory (e.g. VIP) still keep items when this is false.
death:
  keep-inventory: false
  keep-xp: false
  sync-gamerule: true

block-reach:
  enabled: true
  survival: 6.5
  creative: 8.0
  adventure: 6.5
