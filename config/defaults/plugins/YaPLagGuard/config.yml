# YaP LagGuard — shipped defaults (typical SMP)
# Opt-in plugins: leave enabled: false until you want them
# Go public: see docs/start/SECRETS.md + DEFAULTS.md LAN vs public table
# Prefer dashboard: Plugin settings (or Gameplay tab) → Save → reload

# YaP LagGuard — per-chunk lag-machine budgets (Folia-safe)
#
# Defaults target public survival (dense farms OK; lag-machines get cancelled).
# Creative / redstone labs: raise redstone + hopper windows. See docs/plugins/PLUGINS.md.
enabled: true

# Soft entity density per loaded chunk (living + items + projectiles counted)
# Survival: 64–100. Mega farms: 120+. Do not set below ~32 on busy hubs.
max-entities-per-chunk: 72

# Primed TNT entities allowed in one chunk at once (dupe/lag cannons)
max-primed-tnt-per-chunk: 8

# Hopper transfers cancelled per chunk per window when over budget
max-hopper-transfers-per-window: 48
hopper-window-ticks: 20

# Redstone current-change events cancelled per chunk per window
max-redstone-events-per-window: 96
redstone-window-ticks: 20

# Write plugins/YaPLagGuard/stats.json for dashboard / Prometheus
stats-write-interval-ticks: 100

# Log when a budget trips (rate-limited). Off by default — trips still enforce; avoid console flood.
log-trips: false

# ClearLagg-style timed ground-item / XP clear with countdown warnings.
item-clear:
  enabled: true
  interval-seconds: 900
  warn-seconds: [60, 30, 10]
  clear-items: true
  clear-xp-orbs: true
  min-age-ticks: 40
  skip-named: false
  worlds: []
  world-blacklist: []
  exempt-regions: []
  warn-message: "&eGround items clear in &f{seconds}&e seconds."
  clear-message: "&aCleared &f{items}&a items and &f{xp}&a XP orbs."
