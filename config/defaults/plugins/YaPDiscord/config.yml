# YaP Discord — shipped defaults (typical SMP)
# Bridge stays off until you wire it. To go live:
#   1) Set webhooks.chat (and/or bot.token + chat-channel-id)
#   2) Set relay.mc-to-discord: true (and discord-to-mc if using inbound/bot)
#   3) Reload via dashboard Discord tab or /yapdiscord reload
# Go public: see docs/start/SECRETS.md — set a real inbound.secret before enabling inbound.
# Prefer dashboard: Discord / Plugin settings → Save → reload

# Optional Discord bridge — leave empty until you add webhook URLs.
webhooks:
  moderation: ""
  chat: ""
  # Join/leave/death/advancement (falls back to chat webhook if blank)
  events: ""

relay:
  mc-to-discord: false
  discord-to-mc: false

# Server event posts to webhooks.events (or chat). All off by default.
events:
  join: false
  leave: false
  death: false
  advancement: false

# Inbound Discord→MC HTTP. Off by default (enable + set a real secret for production).
inbound:
  enabled: false
  bind: "127.0.0.1"
  port: 8765
  secret: "change-me"
  path: "/discord/inbound"
  max-body-bytes: 8192

bot:
  enabled: false
  token: ""
  guild-id: ""
  chat-channel-id: ""
  slash-commands: true

filters:
  block-everyone: true
  max-length: 500

link:
  enabled: true
  use-shared-yapdb: true
  code-ttl-seconds: 600
  role-sync:
    enabled: true
    roles: {}
  nickname-sync:
    enabled: false
    direction: mc-to-discord
    interval-minutes: 0

text-commands:
  enabled: true
  playerlist: true
  console-prefix: "!c"
  console-whitelist: ["tps", "list"]
  require-roles: []
  listen-all-guild: false

channel-updater:
  enabled: false
  channel-id: ""
  interval-seconds: 60
  topic-template: "Online: {online} | MSPT: {mspt}"

console-channel:
  enabled: false
  channel-id: ""
  inbound: true
  outbound: true
  inbound-roles: []
  command-whitelist: []
  outbound-filter: ["INFO", "WARN", "SEVERE"]
  rate-limit-per-10s: 20
