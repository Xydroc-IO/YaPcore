# Shared SQL pool for YaP plugins (MariaDB/MySQL, PostgreSQL, or SQLite).
# Point every backend at the SAME database for networked engines.
# SQLite is single-node only — see docs/data/SQLITE.md.

jdbc:
  # auto | mysql | postgres | sqlite — auto detects from url prefix
  engine: auto
  # MariaDB: jdbc:mysql://127.0.0.1:3306/yap_playerdata?useSSL=false&allowPublicKeyRetrieval=true
  # Postgres: jdbc:postgresql://127.0.0.1:5432/yap_playerdata
  # SQLite:  jdbc:sqlite:data/yap.db
  # Prefer ./scripts/db/configure-db.sh --engine <mysql|postgres|sqlite>
  url: jdbc:mysql://127.0.0.1:3306/yap_playerdata?useSSL=false&allowPublicKeyRetrieval=true
  user: yap
  password: change-me

pool:
  name: YaPDB
  maximum-pool-size: 16
  minimum-idle: 2
  connection-timeout-ms: 10000
