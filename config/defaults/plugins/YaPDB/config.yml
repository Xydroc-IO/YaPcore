# Shared MariaDB/MySQL for all YaP plugins that need SQL.
# Point every backend at the SAME database (Docker: deploy/mariadb/).

jdbc:
  # Align with deploy/mariadb/.env.example. Prefer ./configure-db.sh after start-mariadb
  # (auto-bumps port to 3316 when host :3306 is already taken).
  url: jdbc:mysql://127.0.0.1:3306/yap_playerdata?useSSL=false&allowPublicKeyRetrieval=true
  user: yap
  password: change-me

pool:
  name: YaPDB
  maximum-pool-size: 16
  minimum-idle: 2
  connection-timeout-ms: 10000
