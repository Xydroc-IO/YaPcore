# YaP Encyclopedia — Purpur-inspired mob/gameplay surface (original YaP code, not a Purpur port).
# Not affiliated with PurpurMC.
# Wired: WASD ridables (+ yapknobs.ride.<mob>), attributes, AI, blocks, gameplay.*, per-mob specials.
# E2 NMS (YaP-Folia patch 0025): gameplay.crop-growth-nms + tick-fluids via YapEncyclopediaHooks.
# Defaults OFF/vanilla — not "full Purpur" without rebuilding YaP-Folia with 0025.
# /yapknobs status shows nmsHooks present=true|false.
# Edit this file (or plugins/YaPGameplayKnobs/knobs.yml after first run).
#
# attributes (any present key applied on spawn/load/reload):
#   max_health, scale, movement_speed, attack_damage, attack_knockback, armor,
#   armor_toughness, follow_range, knockback_resistance, flying_speed, spawn_reinforcements, …
#
# Per-mob AI example:
#   ai:
#     aware: true
#     disable-ai: false
#     disable-random-stroll: false
#     disable-panic: false
#     remove-goals: [CREEPER_SWELL, RANDOM_STROLL]   # VanillaGoal names
#

settings:
  enabled: false
  # Advertise a custom brand in server list (Paper may override)
  server-mod-name: "YaPcore"
  disable-give-dropping: false
  projectiles-bypass-mob-griefing: false

blocks:
  anvil:
    cumulative-cost: true
  barrel:
    rows: 3
  beehive:
    max-bees-inside: 3
  bed:
    explode: true
  crying-obsidian:
    valid-for-portal-frame: false
  lightning-rod:
    range: 128

gameplay:
  entity-blindness-multiplier: 1.0
  tick-fluids: true
  use-void-damage-fix: false
  # 1.0 = vanilla. <1 slows (Paper event). >1 or precise ticks need crop-growth-nms (E2 Folia hook).
  crop-growth-modifier: 1.0
  crop-growth-nms: false
  player:
    netherite-fire-resistance: false
    totem-of-undying-works-in-void: false

