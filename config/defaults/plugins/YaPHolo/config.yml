# YaPHolo — packet-only floating text (no world entities). Requires yap-lib.jar.

enabled: true
persist: true
line-spacing: 0.28
view-distance: 48
refresh-ticks: 10
# armor_stand nameplates stay solid over sky/shaders; text_display shreds long titles
entity: armor_stand
placeholders: true
click-cooldown-ticks: 5
