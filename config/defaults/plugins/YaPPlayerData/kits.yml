# Shared kit definitions — copy this same file to every backend that runs /kit
# (Hub/lobby + survival). Cooldowns + store grants live in MariaDB network-wide.
#
# Access nodes: yapdata.kit.<id>
#   default rank → starter + wood/stone/iron/gold/diamond/netherite + enchanted_*
#   vip / mvp / elite → matching rank kit (1 free / 6h; extra-cost to buy again on CD)
#   VIP starter pack used to grant yapdata.kit.* — prefer explicit kit.<rank> nodes.
#
# Fields:
#   delay-seconds / delay, max-uses (0 = unlimited), cost, extra-cost, first-join, commands
#   armor.helmet|chestplate|leggings|boots, offhand
#   items: material+amount+enchantments+name+lore  OR full Bukkit ItemStack (/createkit)
#   extra-cost: pay this while on cooldown to claim again (rank kits)
#   Cash gear kits: cost every claim, delay-seconds 0 (buy anytime)
# Signs: [Kit] on line 1, kit id on line 2.
# Kits NPC: /npc setplayer kits_shop kits

kits:
  starter:
    delay-seconds: 86400
    first-join: true
    items:
      - material: BREAD
        amount: 16
      - material: WOODEN_SWORD
        amount: 1

  # Unlocked by quest t1_first_steps or store:
  #   yapperm user {username} permission set yapdata.kit.adventurer true
  adventurer:
    delay-seconds: 43200
