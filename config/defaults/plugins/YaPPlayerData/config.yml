# YaP PlayerData — shipped defaults (typical SMP)
# Opt-in plugins: leave enabled: false until you want them (Factions/Skills/…)
# Go public: see docs/start/SECRETS.md + DEFAULTS.md LAN vs public table
# Prefer dashboard: Player data / Plugin settings → Save → reload
# LAN/demo: auth.enabled=false. Public offline-mode: set auth.enabled=true.

# Shared MariaDB/MySQL — prefer YaPDB (yap-db.jar) when installed
use-shared-yapdb: true

# Used only when YaPDB is missing or use-shared-yapdb is false
jdbc:
  # Align with deploy/mariadb/.env.example. Prefer shared YaPDB + ./configure-db.sh.
  url: jdbc:mysql://127.0.0.1:3306/yap_playerdata?useSSL=false&allowPublicKeyRetrieval=true
  user: yap
  password: change-me

pool:
  maximum-pool-size: 8
  minimum-idle: 2
  connection-timeout-ms: 10000

# Unique id for this backend (must differ on every Velocity backend)
server-id: lobby

# Inventory / XP / vitals profile key (hub↔survival portals need global + sync.inventory):
#   global  — shared across all backends (default; YaPPortals / Link transfers)
#   server  — use server-id (per-server / minigame wipe)
#   <name>  — custom shared group (e.g. survival-network)
inventory-profile: global

autosave-seconds: 60
starting-balance: 0.00
lock-ttl-seconds: 120

# Master money switch. false → no /bal /pay, Vault provider, shops/jobs/AH/traders,
# or claim tax (claims themselves can stay on). sync.economy is forced off.
economy:
  enabled: true

# Feature modules (freeze: no new Essentials-class commands without product review).
# shops + auctions on by default; NPC shop catalogs feed YaPNpcs /npc shop.
# NPC shop catalogs (features.traders) feed YaPNpcs /npc shop — no /trader command.
# Money features also require economy.enabled=true.
features:
  homes: true
  warps: true
  kits: true
  mail: true
  shops: true
  jobs: false
  auctions: true
  traders: true
  backpack: true

# Extra storage (not the vanilla E inventory). 45 slots per page; bottom row is tabs.
backpack:
  default-pages: 3
  max-pages: 9

# Offline password auth (AuthMe-class). Session lock is separate (always on).
# LAN/demo default OFF so players join without /register. Enable for public offline-mode.
auth:
  enabled: false
  # true = always require /login even on online-mode servers
  force: false
  # true = skip auth when online-mode=false (Velocity modern forwarding backends)
  trust-velocity: false
  min-password-length: 4
  timeout-seconds: 60
  max-attempts: 5

sync:
  inventory: true
  enderchest: true
  xp: true
  vitals: true
  # Ignored when economy.enabled=false
  economy: true

homes:
  max: 3

mail:
  max-unread: 50

auctions:
  expire-hours: 48
  fee-percent: 0


kits:
  starter:
    delay-seconds: 86400
    items:
      - material: BREAD
        amount: 16
      - material: WOODEN_SWORD
        amount: 1

jobs:
  miner:
    display: Miner
    xp-per-action: 1.0
    break:
      COAL_ORE: 0.50
      DEEPSLATE_COAL_ORE: 0.50
      IRON_ORE: 1.00
      DEEPSLATE_IRON_ORE: 1.00
      DIAMOND_ORE: 5.00
      DEEPSLATE_DIAMOND_ORE: 5.00
  lumberjack:
    display: Lumberjack
    xp-per-action: 1.0
    break:
      OAK_LOG: 0.25
      BIRCH_LOG: 0.25
      SPRUCE_LOG: 0.25
      JUNGLE_LOG: 0.25
      ACACIA_LOG: 0.25
      DARK_OAK_LOG: 0.25
      CHERRY_LOG: 0.25
      MANGROVE_LOG: 0.25
