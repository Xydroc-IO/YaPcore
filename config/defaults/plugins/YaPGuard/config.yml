# YaP Guard — shipped defaults (typical SMP)
# Opt-in plugins: leave enabled: false until you want them
# Go public: see docs/start/SECRETS.md + DEFAULTS.md LAN vs public table
# Prefer dashboard: Plugin settings (or Gameplay tab) → Save → reload

checks:
  fly:
    enabled: true
    sensitivity: 0.6
  speed:
    enabled: true
    sensitivity: 0.7
    max-blocks-per-tick: 0.85
  reach:
    enabled: true
    sensitivity: 0.8
    max-distance: 3.5
  scaffold:
    enabled: true
    sensitivity: 0.7
    max-places-per-second: 8
    require-air-below: true

max-violations-before-kick: 8
violation-decay-seconds: 45
alerts-enabled: true
