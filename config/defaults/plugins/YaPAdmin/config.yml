# YaP Admin — shipped defaults (typical SMP)
# Opt-in plugins: leave enabled: false until you want them
# Go public: see docs/start/SECRETS.md + DEFAULTS.md LAN vs public table
# Prefer dashboard: Plugin settings (or Gameplay tab) → Save → reload

# YaPAdmin — in-game staff super menu
# Docs: docs/ops/WEB_DASHBOARD.md

kits:
  - starter
  - adventurer
  - vip

money-amounts:
  - 100
  - 1000
  - 10000
  - 100000

broadcast-presets:
  - "Server restart in 5 minutes — please find a safe place."
  - "Welcome to the server! Use /menu for homes, warps, and kits."
  - "Staff are online — open a ticket or ask in chat if you need help."

