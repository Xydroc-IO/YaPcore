# YaP Floodgate — shipped defaults (typical SMP)
# Opt-in plugins: leave enabled: false until you want them
# Go public: see docs/start/SECRETS.md + DEFAULTS.md LAN vs public table
# Prefer dashboard: Plugin settings (or Gameplay tab) → Save → reload

# Same key.pem as Floodgate on Velocity (copy from plugins/floodgate/key.pem on the proxy).
# Leave empty to use UUID heuristic only (UUID MSB==0 → Bedrock XUID in LSB).
key-file: key.pem

# Username prefix Floodgate uses on Velocity (informational / strip for display).
username-prefix: "."
